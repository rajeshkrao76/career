<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portal — Raveone Careers</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700;800;900&family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <style>
    .m3-content { padding: 24px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    @media (max-width: 700px) { .stats { grid-template-columns: repeat(2, 1fr); } }
    .card-list { display: flex; flex-direction: column; gap: 10px; }
    .item { display: flex; gap: 12px; align-items: center; padding: 16px; }
    .item .body { flex: 1; min-width: 0; }
    .item .title { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
    .item .meta { font-size: 12px; color: #64748B; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-grid .full { grid-column: 1 / -1; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    .hero-card { background: linear-gradient(135deg, #1A365D, #2A5487); color: #fff; padding: 24px; border-radius: 16px; margin-bottom: 20px; }
    .hero-card h1 { color: #fff; }
    .hero-card p { opacity: .9; font-size: 14px; margin-top: 4px; }
    .empty-tab { text-align: center; padding: 48px 20px; color: #64748B; }
    .strength { display: flex; gap: 3px; margin-top: 6px; }
    .strength-bar { flex: 1; height: 4px; background: #E2E8F0; border-radius: 2px; transition: background .2s; }
    .strength-bar.on-1 { background: #DC2626; }
    .strength-bar.on-2 { background: #F59E0B; }
    .strength-bar.on-3 { background: #16A34A; }

    /* Photo uploader */
    .photo-uploader { display: flex; align-items: center; gap: 18px; padding: 16px; background: #F8FAFC; border: 1px dashed #CBD5E1; border-radius: 12px; margin-bottom: 20px; }
    .photo-preview { width: 88px; height: 88px; border-radius: 50%; background: #1A365D; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; overflow: hidden; flex-shrink: 0; }
    .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
    .photo-actions { flex: 1; }
    .photo-actions h4 { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .photo-actions p { font-size: 11.5px; color: #64748B; margin-bottom: 8px; }
    .photo-btns { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Checklist */
    .checklist { padding: 14px; border: 1px solid #E2E8F0; border-radius: 10px; margin-bottom: 16px; }
    .check-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12.5px; }
    .check-icon { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
    .check-icon.ok { background: #D1FAE5; color: #15803D; }
    .check-icon.missing { background: #FEE2E2; color: #B91C1C; }

    /* Modal */
    .ats-modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.6); backdrop-filter: blur(4px); z-index: 100; display: none; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow-y: auto; }
    .ats-modal-backdrop.open { display: flex; }
    .ats-modal { background: #fff; border-radius: 16px; padding: 24px; max-width: 620px; width: 100%; margin: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); }
    .ats-modal.wide { max-width: 900px; }
    @media (max-width: 600px) { .ats-modal { padding: 18px; border-radius: 12px; } }
  </style>
</head>
<body class="m3">
  <header class="m3-app-bar">
    <div class="m3-app-bar-brand">
      <div class="m3-brand-mark">R</div>
      <div><div class="m3-brand-name">My Portal</div><div class="m3-brand-sub" id="userSub">—</div></div>
    </div>
    <div class="m3-app-bar-spacer"></div>
    <div class="m3-app-bar-actions">
      <a href="index.html" class="m3-btn m3-btn-text m3-btn-sm">Jobs</a>
      <button class="m3-btn m3-btn-text m3-btn-sm" onclick="logout()">Sign out</button>
    </div>
  </header>

  <div class="m3-app-body">
    <nav class="m3-rail">
      <button class="m3-rail-item active" data-tab="dashboard"><span class="m3-rail-icon material-symbols-outlined">dashboard</span><span class="m3-rail-label">Dashboard</span></button>
      <button class="m3-rail-item" data-tab="cv"><span class="m3-rail-icon material-symbols-outlined">description</span><span class="m3-rail-label">My CV</span></button>
      <button class="m3-rail-item" data-tab="profile"><span class="m3-rail-icon material-symbols-outlined">person</span><span class="m3-rail-label">Profile</span></button>
      <button class="m3-rail-item" data-tab="applications"><span class="m3-rail-icon material-symbols-outlined">work</span><span class="m3-rail-label">Applications</span></button>
      <button class="m3-rail-item" data-tab="interviews"><span class="m3-rail-icon material-symbols-outlined">event</span><span class="m3-rail-label">Interviews</span></button>
      <button class="m3-rail-item" data-tab="documents"><span class="m3-rail-icon material-symbols-outlined">folder</span><span class="m3-rail-label">Documents</span></button>
      <button class="m3-rail-item" data-tab="assessments"><span class="m3-rail-icon material-symbols-outlined">quiz</span><span class="m3-rail-label">Assessments</span></button>
      <button class="m3-rail-item" data-tab="alerts"><span class="m3-rail-icon material-symbols-outlined">notifications</span><span class="m3-rail-label">Job Alerts</span></button>
      <button class="m3-rail-item" data-tab="account"><span class="m3-rail-icon material-symbols-outlined">manage_accounts</span><span class="m3-rail-label">Account</span></button>
    </nav>
    <main class="m3-content" id="content">
      <div class="empty-tab">Loading…</div>
    </main>
  </div>

  <div class="ats-modal-backdrop" id="atsModal">
    <div class="ats-modal" id="atsModalBody"></div>
  </div>

  <input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp" style="display:none">

  <script src="app.js"></script>
  <script>
  (function () {
    if (!ATS.requireAuth('candidate', 'portal-login.html')) return;
    const session = ATS.getSession('candidate');
    document.getElementById('userSub').textContent = session.name || session.email;
    const content = document.getElementById('content');
    let CURRENT_TAB = 'dashboard';

    async function call(action, extra) {
      return ATS.post(action, Object.assign({ token: session.token }, extra || {}));
    }
    function handleAuthError(res) {
      return ATS.handleAuthError(res, 'candidate', 'portal-login.html');
    }
    window.logout = async function () {
      await call('portalLogout');
      ATS.clearSession('candidate');
      window.location.replace('index.html');
    };

    document.querySelectorAll('.m3-rail-item').forEach(btn => {
      btn.addEventListener('click', () => {
        CURRENT_TAB = btn.dataset.tab;
        document.querySelectorAll('.m3-rail-item').forEach(b =>
          b.classList.toggle('active', b.dataset.tab === CURRENT_TAB));
        render();
      });
    });
    function render() {
      content.innerHTML = '<div class="empty-tab">Loading…</div>';
      const fn = TABS[CURRENT_TAB];
      if (fn) fn();
    }

    window.showModal = function (html, wide) {
      const modal = document.getElementById('atsModalBody');
      modal.innerHTML = html;
      modal.className = 'ats-modal' + (wide ? ' wide' : '');
      document.getElementById('atsModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    };
    window.closeModal = function () {
      document.getElementById('atsModal').classList.remove('open');
      document.body.style.overflow = '';
    };
    document.getElementById('atsModal').addEventListener('click', e => {
      if (e.target.id === 'atsModal') closeModal();
    });

    /* ═══ DASHBOARD ═══ */
    async function renderDashboard() {
      const res = await call('portalGetDashboard');
      if (handleAuthError(res)) return;
      if (!res.ok) { content.innerHTML = '<div class="empty-tab">Could not load dashboard</div>'; return; }
      const d = res;
      const justApplied = (d.applications || []).filter(a =>
        ['sourced', 'jd shared'].indexOf(String(a.status || '').toLowerCase()) !== -1
      ).slice(0, 20);
      const allUpcoming = (d.upcomingInterviews || []).slice().sort((a, b) =>
        String(a.when || '').localeCompare(String(b.when || ''))
      );

      content.innerHTML = `
        <div class="hero-card">
          <h1 class="m3-h3">Hi ${ATS.esc(d.profile.name || 'there')} 👋</h1>
          <p>${ATS.esc(d.profile.email || '')}</p>
        </div>
        <div class="stats">
          <div class="m3-stat-card"><div class="m3-stat-label">Total</div><div class="m3-stat-value">${d.stats.totalApplications}</div><div class="m3-stat-hint">applications</div></div>
          <div class="m3-stat-card"><div class="m3-stat-label">Active</div><div class="m3-stat-value">${d.stats.activeApplications}</div><div class="m3-stat-hint">in progress</div></div>
          <div class="m3-stat-card"><div class="m3-stat-label">Interviews</div><div class="m3-stat-value">${d.stats.upcomingInterviews}</div><div class="m3-stat-hint">upcoming</div></div>
          <div class="m3-stat-card"><div class="m3-stat-label">Offers</div><div class="m3-stat-value" style="color:#15803D">${d.stats.offers}</div><div class="m3-stat-hint">received</div></div>
        </div>
        <div class="m3-grid-2" style="gap:16px">
          <div class="m3-card" style="padding:20px">
            <h3 class="m3-h4" style="margin-bottom:4px">📥 Just Applied (${justApplied.length})</h3>
            <p class="m3-text-muted" style="font-size:12px;margin-bottom:12px">Recent applications awaiting recruiter review</p>
            <div style="max-height:420px;overflow-y:auto">
              ${justApplied.length ? justApplied.map(a => `
                <div style="padding:12px;border:1px solid #E2E8F0;border-radius:8px;margin-bottom:8px">
                  <div style="font-weight:700;font-size:13px">${ATS.esc(a.jobTitle || 'Role')}</div>
                  <div class="m3-text-muted" style="font-size:11.5px;margin-top:2px">${ATS.esc(a.jobId || '')} · Applied ${ATS.esc(a.appliedAt || '')}</div>
                  <div style="margin-top:6px"><span class="m3-chip ${ATS.statusClass(a.status)}">${ATS.esc(a.status)}</span></div>
                </div>
              `).join('') : '<div class="m3-text-muted" style="font-size:13px;padding:20px;text-align:center">No new applications yet. <a href="index.html">Browse jobs →</a></div>'}
            </div>
          </div>
          <div class="m3-card" style="padding:20px">
            <h3 class="m3-h4" style="margin-bottom:4px">📅 Upcoming Interviews (${allUpcoming.length})</h3>
            <p class="m3-text-muted" style="font-size:12px;margin-bottom:12px">All scheduled interviews from today onward</p>
            <div style="max-height:420px;overflow-y:auto">
              ${allUpcoming.length ? allUpcoming.map(i => `
                <div style="padding:12px;border:1px solid #E2E8F0;border-radius:8px;margin-bottom:8px">
                  <div style="font-weight:700;font-size:13px">${ATS.esc(i.position || 'Interview')}</div>
                  <div class="m3-text-muted" style="font-size:11.5px;margin-top:2px">${ATS.esc(i.date || '')} · ${ATS.esc(i.time || '')} · ${ATS.esc(i.mode || '')}</div>
                  <div class="m3-text-faint" style="font-size:11px;margin-top:2px">${ATS.esc(i.company || '')}</div>
                </div>
              `).join('') : '<div class="m3-text-muted" style="font-size:13px;padding:20px;text-align:center">No interviews scheduled.</div>'}
            </div>
          </div>
        </div>
      `;
    }

    /* ═══ CV BUILDER ═══ */
    async function renderCV() {
      const res = await call('portalGetProfile');
      if (handleAuthError(res)) return;
      if (!res.ok) { content.innerHTML = '<div class="empty-tab">Could not load profile</div>'; return; }
      const p = res.profile || {};
      const experience = Array.isArray(p.experience) ? p.experience : [];
      const education = Array.isArray(p.educationList) ? p.educationList : [];
      window._CV_EXP = experience;
      window._CV_EDU = education;

      // Completeness checklist
      const checks = [
        { label: 'Photo uploaded',       ok: !!p.photoUrl },
        { label: 'Full name',            ok: !!p.name },
        { label: 'Contact (phone)',      ok: !!p.phone },
        { label: 'Education summary',    ok: !!p.education },
        { label: 'Total experience',     ok: !!p.totalExp },
        { label: 'Key skills',           ok: !!p.skills },
        { label: 'At least 1 job',       ok: experience.length > 0 },
        { label: 'At least 1 education', ok: education.length > 0 },
        { label: 'Certifications',       ok: !!p.certifications },
        { label: 'Languages',            ok: !!p.languages }
      ];
      const doneCount = checks.filter(c => c.ok).length;

      content.innerHTML = `
        <div class="m3-flex m3-justify-between m3-items-center" style="margin-bottom:16px;flex-wrap:wrap;gap:10px">
          <div>
            <h1 class="m3-h3">My CV</h1>
            <p class="m3-text-muted" style="font-size:13px;margin-top:4px">Build your professional CV. Changes save automatically.</p>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="m3-btn m3-btn-outlined" onclick="previewCV()">
              <span class="material-symbols-outlined">visibility</span> Preview
            </button>
            <button class="m3-btn m3-btn-filled" onclick="downloadCV('pdf')">
              <span class="material-symbols-outlined">download</span> PDF
            </button>
            <button class="m3-btn m3-btn-outlined" onclick="downloadCV('docx')">
              <span class="material-symbols-outlined">description</span> DOCX
            </button>
          </div>
        </div>

        <div class="checklist">
          <div class="m3-flex m3-justify-between m3-items-center" style="margin-bottom:8px">
            <h3 class="m3-h4" style="margin:0">Completeness: ${doneCount}/${checks.length}</h3>
            <span class="m3-chip ${doneCount === checks.length ? 'm3-chip-success' : doneCount >= 6 ? 'm3-chip-warning' : 'm3-chip-error'}">${Math.round(doneCount / checks.length * 100)}%</span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:4px 16px">
            ${checks.map(c => `
              <div class="check-row">
                <span class="check-icon ${c.ok ? 'ok' : 'missing'}">${c.ok ? '✓' : '✗'}</span>
                <span style="${c.ok ? 'color:#475569' : 'color:#B91C1C;font-weight:600'}">${c.label}</span>
              </div>
            `).join('')}
          </div>
          ${doneCount < checks.length ? `<button class="m3-btn m3-btn-text m3-btn-sm" style="margin-top:8px" onclick="switchTo('profile')">Complete in Profile →</button>` : ''}
        </div>

        <div class="m3-card" style="padding:20px;margin-bottom:16px">
          <div class="m3-flex m3-justify-between m3-items-center" style="margin-bottom:12px">
            <h3 class="m3-h4">Employment History</h3>
            <button class="m3-btn m3-btn-filled m3-btn-sm" onclick="addExperience()">
              <span class="material-symbols-outlined">add</span> Add Job
            </button>
          </div>
          <div id="expList">
            ${experience.length ? experience.map((e, i) => renderExpCard(e, i)).join('')
              : '<div class="m3-text-muted" style="font-size:13px;padding:20px;text-align:center">No jobs yet. Click "Add Job" to start.</div>'}
          </div>
        </div>

        <div class="m3-card" style="padding:20px">
          <div class="m3-flex m3-justify-between m3-items-center" style="margin-bottom:12px">
            <h3 class="m3-h4">Education</h3>
            <button class="m3-btn m3-btn-filled m3-btn-sm" onclick="addEducation()">
              <span class="material-symbols-outlined">add</span> Add Education
            </button>
          </div>
          <div id="eduList">
            ${education.length ? education.map((e, i) => renderEduCard(e, i)).join('')
              : '<div class="m3-text-muted" style="font-size:13px;padding:20px;text-align:center">No education entries yet.</div>'}
          </div>
        </div>
      `;
    }

    function renderExpCard(e, i) {
      const from = e.startDate || '—';
      const to = e.currentlyWorking ? 'Present' : (e.endDate || '—');
      const duration = calcDuration(e.startDate, e.endDate, e.currentlyWorking);
      const respCount = (e.description || []).length;
      return `
        <div class="m3-card" style="padding:14px;margin-bottom:10px;border:1px solid #E2E8F0">
          <div class="m3-flex m3-justify-between" style="align-items:flex-start;gap:10px">
            <div style="flex:1;min-width:0">
              <div style="font-weight:700;font-size:14px">${ATS.esc(e.title || 'Untitled role')}</div>
              <div class="m3-text-muted" style="font-size:12.5px;margin-top:2px">${ATS.esc(e.company || '')}${e.location ? ' · ' + ATS.esc(e.location) : ''}</div>
              <div class="m3-text-faint" style="font-size:11px;margin-top:4px">${from} – ${to}${duration ? ' · ' + duration : ''}</div>
              <div class="m3-text-muted" style="font-size:11px;margin-top:2px">${respCount} responsibilit${respCount === 1 ? 'y' : 'ies'}</div>
            </div>
            <div style="display:flex;gap:4px">
              <button class="m3-btn m3-btn-icon" onclick="editExperience(${i})" title="Edit"><span class="material-symbols-outlined" style="font-size:18px">edit</span></button>
              <button class="m3-btn m3-btn-icon" onclick="deleteExperience(${i})" title="Delete" style="color:#DC2626"><span class="material-symbols-outlined" style="font-size:18px">delete</span></button>
            </div>
          </div>
        </div>`;
    }

    function renderEduCard(e, i) {
      const range = (e.startDate || e.endDate) ? ((e.startDate || '?') + ' – ' + (e.endDate || 'Present')) : '';
      return `
        <div class="m3-card" style="padding:14px;margin-bottom:10px;border:1px solid #E2E8F0">
          <div class="m3-flex m3-justify-between" style="align-items:flex-start;gap:10px">
            <div style="flex:1;min-width:0">
              <div style="font-weight:700;font-size:14px">${ATS.esc((e.degree || '') + (e.field ? ' ' + e.field : ''))}</div>
              <div class="m3-text-muted" style="font-size:12.5px;margin-top:2px">${ATS.esc(e.institution || '')}</div>
              <div class="m3-text-faint" style="font-size:11px;margin-top:4px">${ATS.esc(range)}${e.grade ? ' · ' + ATS.esc(e.grade) : ''}</div>
            </div>
            <div style="display:flex;gap:4px">
              <button class="m3-btn m3-btn-icon" onclick="editEducation(${i})"><span class="material-symbols-outlined" style="font-size:18px">edit</span></button>
              <button class="m3-btn m3-btn-icon" onclick="deleteEducation(${i})" style="color:#DC2626"><span class="material-symbols-outlined" style="font-size:18px">delete</span></button>
            </div>
          </div>
        </div>`;
    }

    function calcDuration(from, to, current) {
      if (!from) return '';
      const fromParts = String(from).match(/(\d{4})(?:-(\d{2}))?/);
      if (!fromParts) return '';
      const fromY = parseInt(fromParts[1], 10);
      const fromM = fromParts[2] ? parseInt(fromParts[2], 10) : 1;
      let toY, toM;
      if (current) { const now = new Date(); toY = now.getFullYear(); toM = now.getMonth() + 1; }
      else {
        const toParts = String(to || '').match(/(\d{4})(?:-(\d{2}))?/);
        if (!toParts) return '';
        toY = parseInt(toParts[1], 10);
        toM = toParts[2] ? parseInt(toParts[2], 10) : 12;
      }
      let months = (toY - fromY) * 12 + (toM - fromM);
      if (months < 0) return '';
      if (months < 12) return months + ' mo';
      const y = Math.floor(months / 12);
      const m = months % 12;
      return y + ' yr' + (m > 0 ? ' ' + m + ' mo' : '');
    }

    window.switchTo = function (tab) {
      CURRENT_TAB = tab;
      document.querySelectorAll('.m3-rail-item').forEach(b =>
        b.classList.toggle('active', b.dataset.tab === tab));
      render();
    };

    window.addExperience = () => openExpModal(-1);
    window.editExperience = (i) => openExpModal(i);

    function openExpModal(idx) {
      const isEdit = idx >= 0;
      const e = isEdit ? (window._CV_EXP || [])[idx] : {};
      const respText = (e.description || []).join('\n');
      showModal(`
        <div class="m3-flex m3-justify-between m3-items-center" style="margin-bottom:16px">
          <h3 class="m3-h3">${isEdit ? 'Edit' : 'Add'} Work Experience</h3>
          <button class="m3-btn m3-btn-icon" onclick="closeModal()"><span class="material-symbols-outlined">close</span></button>
        </div>
        <div class="form-grid">
          <div class="m3-field full"><label class="m3-field-label">Job Title *</label>
            <input class="m3-input" id="exTitle" value="${ATS.esc(e.title||'')}" placeholder="e.g. Senior Engineer"></div>
          <div class="m3-field full"><label class="m3-field-label">Company *</label>
            <input class="m3-input" id="exCompany" value="${ATS.esc(e.company||'')}" placeholder="e.g. ABC Ltd"></div>
          <div class="m3-field full"><label class="m3-field-label">Location</label>
            <input class="m3-input" id="exLocation" value="${ATS.esc(e.location||'')}" placeholder="e.g. Bangalore"></div>
          <div class="m3-field"><label class="m3-field-label">From *</label>
            <input type="month" class="m3-input" id="exFrom" value="${ATS.esc(e.startDate||'')}"></div>
          <div class="m3-field"><label class="m3-field-label">To</label>
            <input type="month" class="m3-input" id="exTo" value="${ATS.esc(e.endDate||'')}" ${e.currentlyWorking ? 'disabled' : ''}></div>
          <div class="full"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
            <input type="checkbox" id="exCurrent" ${e.currentlyWorking ? 'checked' : ''} onchange="document.getElementById('exTo').disabled=this.checked">
            <span>I currently work here</span></label></div>
          <div class="m3-field full"><label class="m3-field-label">Responsibilities &amp; Achievements (one per line)</label>
            <textarea class="m3-textarea" id="exResp" rows="5" placeholder="Led team of 5 engineers&#10;Reduced cycle time by 20%">${ATS.esc(respText)}</textarea>

    window.computeAge = function (dob) {
      const el = document.getElementById('ageDisplay');
      if (!dob) { el.value = ''; return; }
      const d = new Date(dob);
      if (isNaN(d.getTime())) { el.value = ''; return; }
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      el.value = age >= 0 && age <= 120 ? age : '';
    };

    async function handlePhotoUpload(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (file.size > 3 * 1024 * 1024) { ATS.toast('Photo must be under 3 MB', 'error'); return; }
      if (!/^image\/(jpeg|png|webp)$/.test(file.type)) { ATS.toast('Only JPG, PNG, WEBP allowed', 'error'); return; }
      const b64 = await ATS.fileToBase64(file);
      ATS.toast('Uploading photo…');
      const res = await call('portalUploadPhoto', { fileData: b64.base64, fileName: file.name });
      if (res.ok) {
        ATS.toast('Photo uploaded', 'success');
        renderProfile();
      } else {
        ATS.toast(res.error || 'Upload failed', 'error');
      }
      e.target.value = '';
    }

    window.saveProfile = async function (e) {
      e.preventDefault();
      const btn = document.getElementById('saveProfileBtn');
      const fd = new FormData(e.target);
      const profile = {};
      ['name','phone','dateOfBirth','gender','nationality','location','education',
       'totalExp','relExp','currentCtc','expectedCtc','noticePeriod','currentCompany',
       'currentDesignation','reasonLeaving','skills','certifications','machines',
       'languages','preferredLocations','relocate','willingToTravel','linkedin','portfolioUrl']
        .forEach(k => { const v = fd.get(k); if (v !== null) profile[k] = v; });
      // Consent checkbox
      const consentEl = e.target.querySelector('input[name="consent"]');
      profile.consent = !!(consentEl && consentEl.checked);

      btn.disabled = true; btn.textContent = 'Saving…';
      const res = await call('portalUpdateProfile', { profile });
      btn.disabled = false; btn.textContent = 'Save Profile';
      if (res.ok) { ATS.toast('Profile saved', 'success'); renderProfile(); }
      else ATS.toast(res.error || 'Save failed', 'error');

            <div class="body">
              <div class="title">${ATS.esc(i.jobTitle || 'Interview')}</div>
              <div class="meta">${ATS.esc(i.date || '')} · ${ATS.esc(i.mode || '')}</div>
            </div>
            <span class="m3-chip ${ATS.statusClass('interview-scheduled')}">${ATS.esc(i.candidateResponse || 'Completed')}</span>
          </div>`).join('')}</div>` : ''}
        ${(!upcoming.length && !past.length) ? `<div class="empty-tab">
          <span class="material-symbols-outlined" style="font-size:56px;color:#94A3B8">event_busy</span>
          <p class="m3-mt-3">No interviews scheduled.</p>
        </div>` : ''}`;
    }

    window.respondInterview = async function (idx, bucket, response) {
      const list = (window._INTERVIEWS_CACHE || {})[bucket] || [];
      const iv = list[idx];
      if (!iv) return;
      if (!confirm('Set response to "' + response + '"?')) return;
      const res = await call('portalRespondInterview', { interviewId: iv.interviewId, response: response });
      if (res.ok) { ATS.toast('Response recorded', 'success'); renderInterviews(); }
      else ATS.toast(res.error || 'Failed', 'error');
    };

    window.openRescheduleModal = function (idx) {
      const iv = ((window._INTERVIEWS_CACHE || {}).upcoming || [])[idx];
      if (!iv) return;
      showModal(`
        <div class="m3-flex m3-justify-between m3-items-center" style="margin-bottom:16px">
          <div>
            <h3 class="m3-h3">Request Reschedule</h3>
            <p class="m3-text-muted" style="font-size:12px;margin-top:2px">${ATS.esc(iv.jobTitle)} · ${ATS.esc(iv.date)} ${ATS.esc(iv.time)}</p>
          </div>
          <button class="m3-btn m3-btn-icon" onclick="closeModal()"><span class="material-symbols-outlined">close</span></button>
        </div>
        <div class="m3-field" style="margin-bottom:12px"><label class="m3-field-label">Proposed Slot 1 *</label><input type="datetime-local" class="m3-input" id="rsSlot1"></div>
        <div class="m3-field" style="margin-bottom:12px"><label class="m3-field-label">Proposed Slot 2 (optional)</label><input type="datetime-local" class="m3-input" id="rsSlot2"></div>
        <div class="m3-field" style="margin-bottom:12px"><label class="m3-field-label">Proposed Slot 3 (optional)</label><input type="datetime-local" class="m3-input" id="rsSlot3"></div>
        <div class="m3-field" style="margin-bottom:16px"><label class="m3-field-label">Reason (optional)</label><textarea class="m3-textarea" id="rsNote" rows="2"></textarea></div>
        <div id="rsErr" style="color:#DC2626;font-size:12px;margin-bottom:8px"></div>
        <div class="m3-flex m3-justify-end m3-gap-2">
          <button class="m3-btn m3-btn-text" onclick="closeModal()">Cancel</button>
          <button class="m3-btn m3-btn-filled" id="rsBtn" onclick="submitReschedule('${iv.interviewId}')">Submit Request</button>
        </div>
      `);
    };

    window.submitReschedule = async function (interviewId) {
      const s1 = document.getElementById('rsSlot1').value;
      const s2 = document.getElementById('rsSlot2').value;
      const s3 = document.getElementById('rsSlot3').value;
      const note = document.getElementById('rsNote').value.trim();
      const errEl = document.getElementById('rsErr');
      errEl.textContent = '';
      const slots = [s1, s2, s3].filter(Boolean);
      if (!slots.length) { errEl.textContent = 'Please propose at least one slot'; return; }
      const btn = document.getElementById('rsBtn');
      btn.disabled = true; btn.textContent = 'Submitting…';
      const res = await call('portalRespondInterview', {
        interviewId, response: 'Reschedule Requested', proposedSlots: slots, note
      });
      btn.disabled = false; btn.textContent = 'Submit Request';
      if (!res.ok) { errEl.textContent = res.error || 'Failed'; return; }
      ATS.toast('Reschedule request submitted', 'success');
      closeModal();
      renderInterviews();
    };

    /* ═══ DOCUMENTS ═══ */
    async function renderDocuments() {
      const res = await call('portalGetDocuments');
      if (handleAuthError(res)) return;
      if (!res.ok) { content.innerHTML = '<div class="empty-tab">Could not load</div>'; return; }
      const docs = res.documents || [];
      const types = res.types || [];
      content.innerHTML = `
        <div class="m3-flex m3-justify-between m3-items-center" style="margin-bottom:16px">
          <h1 class="m3-h3">My Documents</h1>
          <button class="m3-btn m3-btn-filled" onclick="showUploadDoc()">
            <span class="material-symbols-outlined">upload</span> Upload
          </button>
        </div>
        <div id="uploadDocPanel" class="m3-card" style="display:none;padding:20px;margin-bottom:16px">
          <form class="form-grid" onsubmit="uploadDoc(event)">
            <div class="m3-field"><label class="m3-field-label">Document Type</label>
              <select class="m3-select" name="docType">${types.map(t => `<option>${ATS.esc(t)}</option>`).join('')}</select>
            </div>
            <div class="m3-field"><label class="m3-field-label">File (max 10 MB)</label>
              <input type="file" class="m3-input" name="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" required>
            </div>
            <div class="full" style="display:flex;justify-content:flex-end;gap:8px">
              <button type="button" class="m3-btn m3-btn-text" onclick="document.getElementById('uploadDocPanel').style.display='none'">Cancel</button>
              <button type="submit" class="m3-btn m3-btn-filled" id="uploadBtn">Upload</button>
            </div>
          </form>
        </div>
        ${docs.length ? `<div class="card-list">${docs.map(d => `
          <div class="m3-card item">
            <span class="material-symbols-outlined" style="color:#1A365D;font-size:28px">description</span>
            <div class="body">
              <div class="title">${ATS.esc(d.docName)}</div>
              <div class="meta">${ATS.esc(d.docType)} · ${ATS.esc(d.uploadedAt)} · ${Math.round((d.sizeBytes||0)/1024)} KB</div>
            </div>
            <a class="m3-btn m3-btn-text m3-btn-sm" href="${ATS.esc(d.driveUrl)}" target="_blank" rel="noopener">Open</a>
            <button class="m3-btn m3-btn-text m3-btn-sm" onclick="delDoc('${d.docId}')" style="color:#DC2626">Delete</button>
          </div>`).join('')}</div>`
          : `<div class="empty-tab"><span class="material-symbols-outlined" style="font-size:56px;color:#94A3B8">folder_open</span>
              <p class="m3-mt-3">No documents uploaded yet.</p></div>`}`;
    }

    window.showUploadDoc = () => document.getElementById('uploadDocPanel').style.display = 'block';

    window.uploadDoc = async function (e) {
      e.preventDefault();
      const btn = document.getElementById('uploadBtn');
      const fd = new FormData(e.target);
      const file = fd.get('file');
      if (!file || !file.size) return;
      if (file.size > 9 * 1024 * 1024) { ATS.toast('File must be under 9 MB', 'error'); return; }
      btn.disabled = true; btn.textContent = 'Uploading…';
      const b64 = await ATS.fileToBase64(file);
      const res = await call('portalUploadDocument', {
        docType: fd.get('docType'),
        fileData: 'data:' + b64.type + ';base64,' + b64.base64,
        fileName: b64.name
      });
      btn.disabled = false; btn.textContent = 'Upload';
      if (res.ok) { ATS.toast('Uploaded', 'success'); renderDocuments(); }
      else ATS.toast(res.error || 'Upload failed', 'error');
    };

    window.delDoc = async function (docId) {
      if (!confirm('Delete this document?')) return;
      const res = await call('portalDeleteDocument', { docId });
      if (res.ok) { ATS.toast('Deleted'); renderDocuments(); }
      else ATS.toast(res.error || 'Delete failed', 'error');
    };

    /* ═══ ASSESSMENTS ═══ */
    async function renderAssessments() {
      const res = await call('portalGetAssessments');
      if (handleAuthError(res)) return;
      if (!res.ok) {
        content.innerHTML = '<div class="empty-tab"><span class="material-symbols-outlined" style="font-size:56px;color:#94A3B8">quiz</span><p class="m3-mt-3">Assessments are not available right now.</p></div>';
        return;
      }
      const list = res.assessments || [];
      content.innerHTML = `
        <h1 class="m3-h3" style="margin-bottom:16px">My Assessments (${list.length})</h1>
        ${list.length ? `<div class="card-list">${list.map(a => `
          <div class="m3-card" style="padding:16px">
            <div class="m3-flex m3-justify-between" style="align-items:flex-start;gap:10px;margin-bottom:8px">
              <div>
                <div style="font-weight:700;font-size:14px">${ATS.esc(a.name)}</div>
                <div class="m3-text-muted" style="font-size:12px;margin-top:2px">${ATS.esc(a.type || '')} · ${ATS.esc(a.mode || '')}</div>
              </div>
              <span class="m3-chip ${a.result === 'Pass' ? 'm3-chip-success' : a.result === 'Fail' ? 'm3-chip-error' : 'm3-chip-warning'}">${ATS.esc(a.result || a.status)}</span>
            </div>
            ${a.dueDate ? `<div class="m3-text-faint" style="font-size:11.5px;margin-bottom:6px">Due: ${ATS.esc(a.dueDate)}</div>` : ''}
            ${a.instructions ? `<div class="m3-text-muted" style="font-size:12px;white-space:pre-line;margin-top:6px">${ATS.esc(a.instructions)}</div>` : ''}
            ${a.score !== '' && a.score != null ? `<div style="margin-top:8px;font-size:13px"><b>Score:</b> ${ATS.esc(a.score)} / ${ATS.esc(a.maxScore)}</div>` : ''}
            ${a.mode === 'External' && a.link ? `<a href="${ATS.esc(a.link)}" target="_blank" rel="noopener" class="m3-btn m3-btn-filled m3-btn-sm m3-mt-3">Open Assessment</a>` : ''}
          </div>`).join('')}</div>`
          : `<div class="empty-tab"><span class="material-symbols-outlined" style="font-size:56px;color:#94A3B8">quiz</span>
              <p class="m3-mt-3">No assessments assigned.</p></div>`}`;
    }

    /* ═══ ALERTS ═══ */
    async function renderAlerts() {
      const res = await call('portalGetAlertPrefs');
      if (handleAuthError(res)) return;
      if (!res.ok) { content.innerHTML = '<div class="empty-tab">Could not load</div>'; return; }
      content.innerHTML = `
        <div class="m3-card" style="padding:24px;max-width:720px">
          <h1 class="m3-h3" style="margin-bottom:4px">Job Alerts</h1>
          <p class="m3-text-muted" style="margin-bottom:20px">Get a <b>weekly email every Monday</b> with new jobs matching your preferences.</p>
          <form id="alertForm" onsubmit="saveAlerts(event)">
            <div class="m3-field" style="margin-bottom:16px">
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
                <input type="checkbox" id="alertEnabled" ${res.enabled ? 'checked' : ''}>
                <span class="m3-field-label" style="margin-bottom:0;text-transform:none;font-size:13px">Enable weekly job alerts</span>
              </label>
            </div>
            <div class="form-grid">
              <div class="m3-field full"><label class="m3-field-label">Keywords (comma-separated)</label>
                <input class="m3-input" name="keywords" value="${ATS.esc(res.keywords||'')}" placeholder="e.g. CNC, VMC, Quality"></div>
              <div class="m3-field full"><label class="m3-field-label">Preferred Locations</label>
                <input class="m3-input" name="locations" value="${ATS.esc(res.locations||'')}" placeholder="e.g. Bangalore, Chennai"></div>
            </div>
            <p class="m3-text-caption" style="margin-top:12px">Leave keywords and locations blank to receive alerts for <b>all new jobs</b>.</p>
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">
              <button type="submit" class="m3-btn m3-btn-filled" id="saveAlertBtn">Save Preferences</button>
            </div>
          </form>
          ${res.lastSent ? `<p class="m3-text-caption" style="margin-top:16px">Last week's digest sent: ${ATS.esc(res.lastSent)}</p>` : '<p class="m3-text-caption" style="margin-top:16px">No digest sent yet.</p>'}
        </div>`;
    }

    window.saveAlerts = async function (e) {
      e.preventDefault();
      const btn = document.getElementById('saveAlertBtn');
      const fd = new FormData(e.target);
      btn.disabled = true; btn.textContent = 'Saving…';
      const res = await call('portalUpdateAlertPrefs', {
        enabled: document.getElementById('alertEnabled').checked,
        keywords: fd.get('keywords'), locations: fd.get('locations')
      });
      btn.disabled = false; btn.textContent = 'Save Preferences';
      if (res.ok) ATS.toast('Preferences saved', 'success');
      else ATS.toast(res.error || 'Save failed', 'error');
    };

    /* ═══ ACCOUNT ═══ */
    async function renderAccount() {
      content.innerHTML = `
        <div class="m3-card" style="padding:24px;max-width:600px;margin-bottom:20px">
          <h1 class="m3-h3" style="margin-bottom:4px">Account</h1>
          <p class="m3-text-muted" style="margin-bottom:20px">${ATS.esc(session.email)}</p>
          <h3 class="m3-h4" style="margin-bottom:12px">Change Password</h3>
          <div class="m3-field" style="margin-bottom:12px"><label class="m3-field-label">Current Password</label><input type="password" class="m3-input" id="chCurPw" autocomplete="current-password"></div>
          <div class="m3-field" style="margin-bottom:12px"><label class="m3-field-label">New Password</label>
            <input type="password" class="m3-input" id="chNewPw" autocomplete="new-password" oninput="updatePwStrength()">
            <div class="strength" id="chStrength"><div class="strength-bar"></div><div class="strength-bar"></div><div class="strength-bar"></div></div>
          </div>
          <div class="m3-field" style="margin-bottom:16px"><label class="m3-field-label">Confirm New Password</label><input type="password" class="m3-input" id="chConfirmPw" autocomplete="new-password"></div>
          <div id="chErr" style="color:#DC2626;font-size:12px;margin-bottom:8px"></div>
          <button class="m3-btn m3-btn-filled" id="chBtn" onclick="doChangePassword()">Update Password</button>
        </div>`;
    }

    window.updatePwStrength = function () {
      const s = ATS.passwordStrength(document.getElementById('chNewPw').value);
      document.querySelectorAll('#chStrength .strength-bar').forEach((bar, i) => {
        bar.className = 'strength-bar' + (i < s.score ? ' on-' + s.score : '');
      });
    };

    window.doChangePassword = async function () {
      const cur = document.getElementById('chCurPw').value;
      const nw = document.getElementById('chNewPw').value;
      const cf = document.getElementById('chConfirmPw').value;
      const errEl = document.getElementById('chErr');
      errEl.textContent = '';
      if (!cur || !nw) { errEl.textContent = 'All fields are required'; return; }
      if (nw !== cf) { errEl.textContent = 'New passwords do not match'; return; }
      if (!ATS.passwordStrength(nw).valid) { errEl.textContent = 'Password does not meet requirements'; return; }
      const btn = document.getElementById('chBtn');
      btn.disabled = true; btn.textContent = 'Updating…';
      const res = await call('portalChangePassword', { currentPassword: cur, newPassword: nw });
      btn.disabled = false; btn.textContent = 'Update Password';
      if (res.ok) {
        ATS.toast('Password updated', 'success');
        document.getElementById('chCurPw').value = '';
        document.getElementById('chNewPw').value = '';
        document.getElementById('chConfirmPw').value = '';
        updatePwStrength();
      } else errEl.textContent = res.error || 'Update failed';
    };

    /* ═══ TAB MAP ═══ */
    const TABS = {
      dashboard: renderDashboard,
      cv: renderCV,
      profile: renderProfile,
      applications: renderApplications,
      interviews: renderInterviews,
      documents: renderDocuments,
      assessments: renderAssessments,
      alerts: renderAlerts,
      account: renderAccount
    };

    render();
  })();
  </script>
</body>
</html>
