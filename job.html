<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Loading… | Raveone Careers</title>
  <meta name="description" id="pageDesc" content="Apply for this role at Raveone Consultants.">
  <link rel="canonical" id="canonicalUrl" href="">

  <meta property="og:type" content="article">
  <meta property="og:title" id="ogTitle" content="">
  <meta property="og:description" id="ogDesc" content="">
  <meta property="og:url" id="ogUrl" content="">
  <meta property="og:site_name" content="Raveone Careers">

  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700;800;900&family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

  <!-- JobPosting schema injected here by JS after fetch -->
  <script id="jobPostingSchema" type="application/ld+json"></script>

  <style>
    .wrap { max-width: 960px; margin: 0 auto; padding: 32px 20px 60px; }
    .back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: #64748B; text-decoration: none; margin-bottom: 16px; font-weight: 600; }
    .head { padding: 28px; margin-bottom: 20px; }
    .head h1 { font-size: 28px; margin-bottom: 12px; }
    .head .meta { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; color: #475569; margin-bottom: 16px; }
    .head .meta span { display: inline-flex; align-items: center; gap: 4px; }
    .head .salary { font-weight: 700; color: #15803D; font-size: 15px; }
    .head .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
    .body-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    @media (max-width: 800px) { .body-grid { grid-template-columns: 1fr; } }
    .desc { white-space: pre-line; line-height: 1.75; color: #334155; }
    .desc p { margin-bottom: 12px; }
    .side-card { padding: 20px; }
    .side-card h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #64748B; margin-bottom: 10px; }
    .side-card ul { list-style: none; padding: 0; }
    .side-card li { padding: 6px 0; font-size: 13px; color: #334155; display: flex; gap: 8px; align-items: flex-start; }
    .side-card li::before { content: '•'; color: #1A365D; font-weight: 700; }
    .loader { text-align: center; padding: 80px 20px; color: #64748B; }
    .spinner { width: 32px; height: 32px; border: 3px solid #E2E8F0; border-top-color: #1A365D; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="m3">
  <header class="m3-app-bar">
    <div class="m3-app-bar-brand">
      <div class="m3-brand-mark">R</div>
      <div>
        <div class="m3-brand-name">Raveone Careers</div>
        <div class="m3-brand-sub">Role detail</div>
      </div>
    </div>
    <div class="m3-app-bar-spacer"></div>
    <div class="m3-app-bar-actions">
      <a href="index.html" class="m3-btn m3-btn-text m3-btn-sm">All jobs</a>
      <a href="portal-login.html" class="m3-btn m3-btn-outlined m3-btn-sm">Candidate Login</a>
    </div>
  </header>

  <div class="wrap" id="wrap">
    <div class="loader"><div class="spinner"></div>Loading role…</div>
  </div>

  <script src="app.js"></script>
  <script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const jobId = params.get('job');
    const wrap = document.getElementById('wrap');

    if (!jobId) {
      wrap.innerHTML = `<div class="empty">No job ID provided. <a href="index.html">View all jobs</a></div>`;
      return;
    }

    function mapEmploymentType(t) {
      const s = String(t || '').toLowerCase();
      if (s.includes('part')) return 'PART_TIME';
      if (s.includes('contract')) return 'CONTRACTOR';
      if (s.includes('temp')) return 'TEMPORARY';
      if (s.includes('intern')) return 'INTERN';
      if (s.includes('free')) return 'OTHER';
      return 'FULL_TIME';
    }

    function buildJobPostingSchema(job) {
      const postedIso = ATS.toIsoDate(job.postedDate);
      const validThrough = job.validThrough ? ATS.toIsoDate(job.validThrough) : ATS.addDays(postedIso, 90);

      let descriptionHtml = String(job.description || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .split(/\n\n+/).map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
        
      if (job.education) descriptionHtml += '<p><strong>Education:</strong> ' + job.education + '</p>';
      if (job.minExp || job.maxExp) descriptionHtml += '<p><strong>Experience:</strong> ' + (job.minExp || '0') + ' - ' + (job.maxExp || '+') + ' years</p>';

      const address = {
        '@type': 'PostalAddress',
        addressLocality: job.addressLocality || job.location || 'India',
        addressCountry: job.country || 'IN'
      };
      if (job.addressRegion) address.addressRegion = job.addressRegion;
      if (job.postalCode) address.postalCode = job.postalCode;

      function toInrAmount(raw) {
        const n = parseFloat(String(raw || '0').replace(/[^\d.]/g, ''));
        if (!n || isNaN(n)) return 0;
        return n < 100 ? Math.round(n * 100000) : Math.round(n);
      }
      const minVal = toInrAmount(job.minSalary);
      const maxVal = toInrAmount(job.maxSalary) || minVal;

      const schema = {
        '@context': 'https://schema.org/',
        '@type': 'JobPosting',
        title: job.title,
        description: descriptionHtml,
        datePosted: postedIso,
        validThrough: validThrough,
        employmentType: mapEmploymentType(job.employmentType),
        directApply: true,
        identifier: { '@type': 'PropertyValue', name: 'Raveone Consultants', value: job.jobId },
        hiringOrganization: {
          '@type': 'Organization',
          name: job.company || 'Raveone Consultants',
          sameAs: job.website || 'https://www.raveone.in',
          logo: 'https://careers.raveone.in/logo.jpg'
        },
        jobLocation: {
          '@type': 'Place',
          address: address
        }
      };

      if (minVal > 0) {
        schema.baseSalary = {
          '@type': 'MonetaryAmount',
          currency: job.salaryCurrency || 'INR',
          value: { '@type': 'QuantitativeValue', minValue: minVal, maxValue: maxVal, unitText: job.salaryUnit || 'YEAR' }
        };
      }
      if (Array.isArray(job.skills) && job.skills.length) schema.skills = job.skills.join(', ');

      return schema;
    }

    function renderJob(job) {
      const url = 'https://careers.raveone.in/job.html?job=' + encodeURIComponent(job.jobId);
      document.getElementById('pageTitle').textContent = job.title + ' at ' + (job.company || 'Raveone') + ' | Raveone Careers';
      document.getElementById('pageDesc').setAttribute('content',
        (job.title + ' at ' + (job.company || 'Raveone') + ' in ' + (job.location || 'India') + '. Apply now.').substring(0, 160));
      document.getElementById('canonicalUrl').setAttribute('href', url);
      document.getElementById('ogTitle').setAttribute('content', job.title + ' · ' + (job.company || ''));
      document.getElementById('ogDesc').setAttribute('content', (job.description || '').substring(0, 160));
      document.getElementById('ogUrl').setAttribute('content', url);

      const exp = (job.minExp || job.maxExp) ? `${ATS.esc(job.minExp || '0')}–${ATS.esc(job.maxExp || '+')} years` : 'Any experience';
      const skillsHtml = (job.skills || []).map(s =>
        `<span class="m3-chip m3-chip-neutral" style="margin-right:4px">${ATS.esc(s)}</span>`).join('');
      const benHtml = (job.benefits || []).map(b => `<li>${ATS.esc(b)}</li>`).join('');

      wrap.innerHTML = `
        <a href="index.html" class="back">
          <span class="material-symbols-outlined" style="font-size:18px">arrow_back</span>
          All open roles
        </a>
        <div class="m3-card head">
          <h1 class="m3-h2">${ATS.esc(job.title)}</h1>
          <div class="meta">
            <span><span class="material-symbols-outlined" style="font-size:18px">apartment</span>${ATS.esc(job.company || '—')}</span>
            <span><span class="material-symbols-outlined" style="font-size:18px">location_on</span>${ATS.esc(job.location || '—')}</span>
            <span><span class="material-symbols-outlined" style="font-size:18px">work_history</span>${exp}</span>
            <span><span class="material-symbols-outlined" style="font-size:18px">schedule</span>${ATS.esc(job.employmentType || 'Full Time')}</span>
            <span class="salary">${ATS.esc(job.salaryDisplay || 'Salary not disclosed')}</span>
          </div>
          <div class="m3-text-caption">Job ID: <b>${ATS.esc(job.jobId)}</b> · Posted ${ATS.fmtDate(job.postedDate)} · ${ATS.esc(String(job.positions || 1))} position${job.positions > 1 ? 's' : ''}</div>
          
          <!-- UPDATED: Buttons now redirect to the Candidate Portal -->
          <div class="actions">
            <a href="portal-login.html?job=${encodeURIComponent(job.jobId)}" class="m3-btn m3-btn-filled">
              <span class="material-symbols-outlined">send</span> Apply Now
            </a>
            <a href="portal-login.html?talent=true" class="m3-btn m3-btn-outlined">Save CV for future roles</a>
          </div>
        </div>
        
        <div class="body-grid">
          <div>
            <div class="m3-card" style="padding:24px;margin-bottom:16px">
              <h3 class="m3-h4" style="margin-bottom:12px">Job Description</h3>
              <div class="desc">${ATS.esc(job.description || 'No description provided.')}</div>
            </div>
            ${job.requirements ? `<div class="m3-card" style="padding:24px;margin-bottom:16px">
              <h3 class="m3-h4" style="margin-bottom:12px">Requirements</h3>
              <div class="desc">${ATS.esc(job.requirements)}</div>
            </div>` : ''}
            ${benHtml ? `<div class="m3-card" style="padding:24px;margin-bottom:16px">
              <h3 class="m3-h4" style="margin-bottom:12px">Benefits</h3>
              <ul style="padding-left:20px;line-height:2;color:#334155">${benHtml}</ul>
            </div>` : ''}
          </div>
          <aside>
            <div class="m3-card side-card" style="margin-bottom:16px">
              <h4>Key Skills</h4>
              <div>${skillsHtml || '<span class="m3-text-muted">—</span>'}</div>
            </div>
            <div class="m3-card side-card" style="margin-bottom:16px">
              <h4>Quick Facts</h4>
              <ul>
                ${job.education ? `<li>${ATS.esc(job.education)}</li>` : ''}
                ${job.industry ? `<li>${ATS.esc(job.industry)}</li>` : ''}
                ${job.category ? `<li>${ATS.esc(job.category)}</li>` : ''}
                ${job.address ? `<li>${ATS.esc(job.address)}</li>` : ''}
                ${job.website ? `<li><a href="${ATS.esc(job.website)}" target="_blank" rel="noopener">${ATS.esc(job.website)}</a></li>` : ''}
              </ul>
            </div>
            <div class="m3-card side-card">
              <h4>About the client</h4>
              <p class="m3-text-muted" style="font-size:13px;line-height:1.7">
                ${ATS.esc(job.company || 'Confidential')} · ${ATS.esc(job.location || '')}
                ${job.website ? `<br><a href="${ATS.esc(job.website)}" target="_blank" rel="noopener" style="color:#2A5487">Visit website →</a>` : ''}
              </p>
            </div>
          </aside>
        </div>`;

      document.getElementById('jobPostingSchema').textContent = JSON.stringify(buildJobPostingSchema(job));
    }

    (async function load() {
      const job = await ATS.getJob(jobId);
      if (!job) {
        wrap.innerHTML = `<div class="empty m3-card">
          <span class="material-symbols-outlined" style="font-size:64px;color:#94A3B8">work_off</span>
          <h2 class="m3-h3 m3-mt-3">Role not found</h2>
          <p class="m3-mt-2">This job may have been filled or removed.</p>
          <a href="index.html" class="m3-btn m3-btn-filled m3-mt-4">View all open roles</a>
        </div>`;
        return;
      }
      renderJob(job);
    })();
  })();
  </script>
</body>
</html>
