<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading… | Raveone Careers</title>
<meta name="description" content="Curated job opportunities from Raveone Consultants.">
<link rel="canonical" id="canonicalLink" href="https://career.raveone.in/">
<style>
:root {
  --navy: #1A365D; --navy-2: #2A5487; --gold: #A16207; --gold-bg: #FEF3C7;
  --bg: #F8FAFC; --surface: #FFFFFF; --border: #E2E8F0;
  --text: #0F172A; --text-muted: #475569; --text-light: #94A3B8;
  --blue: #2563EB; --blue-bg: #DBEAFE; --success: #15803D; --success-bg: #D1FAE5;
  --warning: #B45309; --warning-bg: #FEF3C7; --danger: #B91C1C; --danger-bg: #FEE2E2;
  --radius: 16px; --shadow: 0 1px 3px rgba(15,23,42,.06); --shadow-md: 0 8px 24px -4px rgba(15,23,42,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; font-size: 15px; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }

/* Header */
.site-header { background: rgba(255,255,255,.95); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px); }
.header-inner { max-width: 1100px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; color: var(--navy); }
.brand-mark { width: 34px; height: 34px; background: linear-gradient(135deg, var(--navy), var(--navy-2)); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 15px; }
.header-nav a { font-size: 14px; font-weight: 500; color: var(--text-muted); padding: 8px 14px; border-radius: 6px; }
.header-nav a:hover { color: var(--text); background: var(--bg); }

/* Layout */
.detail-layout { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; display: grid; grid-template-columns: 1fr 360px; gap: 32px; align-items: start; }
@media (max-width: 900px) { .detail-layout { grid-template-columns: 1fr; } }
.back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 14px; font-weight: 600; margin-bottom: 20px; transition: color .15s; }
.back-link:hover { color: var(--navy); }

/* Detail Card */
.detail-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px; margin-bottom: 24px; box-shadow: var(--shadow); }
.detail-header { border-bottom: 1px solid var(--border); padding-bottom: 24px; margin-bottom: 24px; }
.detail-header h1 { font-size: 32px; font-weight: 800; color: var(--navy); margin-bottom: 8px; line-height: 1.2; letter-spacing: -0.02em; }
.detail-company { font-size: 16px; color: var(--text-muted); font-weight: 500; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.detail-company a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
.detail-pills { display: flex; flex-wrap: wrap; gap: 8px; }

.meta-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 100px; font-size: 13px; font-weight: 600; }
.meta-id { background: var(--bg); color: var(--text-muted); font-family: ui-monospace, monospace; }
.meta-loc { background: var(--blue-bg); color: var(--blue); }
.meta-exp { background: var(--warning-bg); color: var(--warning); }
.meta-salary { background: var(--success-bg); color: var(--success); }
.meta-type { background: var(--bg); color: var(--text-muted); }
.meta-positions { background: var(--gold-bg); color: var(--gold); }

/* Overview Grid */
.overview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 24px; }
.overview-item { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; }
.overview-icon { font-size: 20px; margin-bottom: 4px; }
.overview-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-light); letter-spacing: 0.5px; margin-bottom: 4px; }
.overview-value { font-size: 14px; font-weight: 600; color: var(--text); }
@media (max-width: 600px) { .overview-grid { grid-template-columns: 1fr; } }

/* Sections */
.section-title { font-size: 18px; font-weight: 700; color: var(--navy); margin: 32px 0 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.section-title:first-of-type { margin-top: 0; }
.section-body { font-size: 15px; color: var(--text-muted); white-space: pre-wrap; line-height: 1.8; }

/* Skills & Benefits */
.skills-list { display: flex; flex-wrap: wrap; gap: 8px; }
.skill-tag { padding: 8px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 100px; font-size: 13px; font-weight: 600; color: var(--text-muted); }
.benefit-tag { padding: 8px 16px; background: var(--success-bg); border: 1px solid #BBF7D0; border-radius: 100px; font-size: 13px; font-weight: 600; color: var(--success); }

/* Sidebar */
.sidebar { position: sticky; top: 88px; }
.apply-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; margin-bottom: 20px; box-shadow: var(--shadow-md); }
.apply-card h3 { font-size: 20px; font-weight: 800; color: var(--navy); margin-bottom: 12px; }
.apply-card p { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.6; }
.btn-primary { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px 20px; background: var(--navy); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; transition: all .2s; text-decoration: none; box-shadow: 0 4px 6px -1px rgba(26,54,93,0.2); }
.btn-primary:hover { background: var(--navy-2); transform: translateY(-2px); box-shadow: 0 6px 8px -1px rgba(26,54,93,0.3); }
.btn-secondary { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 12px 16px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all .15s; margin-top: 12px; }
.btn-secondary:hover { background: var(--bg); border-color: var(--navy); }

/* Skeleton */
.skeleton { background: linear-gradient(90deg, #F1F5F9 0%, #E2E8F0 50%, #F1F5F9 100%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.skeleton-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; }
.skeleton-line { height: 16px; margin-bottom: 12px; }
.skeleton-line-lg { height: 28px; width: 60%; margin-bottom: 16px; }
.skeleton-line-md { width: 40%; }

/* Error / 404 */
.msg-box { text-align: center; padding: 60px 24px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.msg-box .icon { font-size: 48px; margin-bottom: 16px; }
.msg-box h2 { font-size: 24px; color: var(--navy); margin-bottom: 8px; }
.msg-box p { color: var(--text-muted); margin-bottom: 24px; }

/* Footer */
.site-footer { background: var(--navy); color: var(--text-light); padding: 40px 24px 32px; margin-top: 80px; }
.footer-inner { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
.footer-inner .brand { color: white; }

@media (max-width: 640px) {
  .detail-card { padding: 24px; }
  .detail-header h1 { font-size: 26px; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="./" class="brand"><div class="brand-mark">R</div><span>Raveone Careers</span></a>
    <nav class="header-nav"><a href="./">All Jobs</a></nav>
  </div>
</header>

<main id="jobMain" class="detail-layout">
  <div>
    <div class="skeleton-card">
      <div class="skeleton skeleton-line skeleton-line-lg"></div>
      <div class="skeleton skeleton-line skeleton-line-md"></div>
      <div style="margin-top:20px">
        <div class="skeleton skeleton-line" style="width:100%"></div>
        <div class="skeleton skeleton-line" style="width:90%"></div>
        <div class="skeleton skeleton-line" style="width:75%"></div>
      </div>
    </div>
  </div>
  <aside class="sidebar">
    <div class="skeleton-card">
      <div class="skeleton skeleton-line skeleton-line-md"></div>
      <div class="skeleton skeleton-line" style="height:50px;margin-top:20px"></div>
    </div>
  </aside>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="brand"><div class="brand-mark">R</div><span>Raveone Careers</span></div>
    <p>&copy; <span id="footerYear">2026</span> Raveone Consultants</p>
  </div>
</footer>

<script>
(function () {
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycby11ZYopJAAbHT0tsBu4v5YQe9TTpc_m88O43YhmEGYUg0kOlpudIDSWVF34ESc30k/exec";
  var SITE_URL = window.location.origin + window.location.pathname.replace(/\/job\.html$/, '');

  document.getElementById('footerYear').textContent = new Date().getFullYear();

  var params = new URLSearchParams(window.location.search);
  var jobId = (params.get('job') || params.get('id') || '').trim();

  if (!jobId) { show404('No job ID provided in the URL.'); return; }

  var canonical = document.getElementById('canonicalLink');
  if (canonical) canonical.href = SITE_URL + '/job.html?job=' + encodeURIComponent(jobId);

  fetch(SCRIPT_URL + '?action=job&id=' + encodeURIComponent(jobId))
    .then(function (r) {
      if (!r.ok) throw new Error('Server returned ' + r.status);
      return r.json();
    })
    .then(function (job) {
      if (!job || !job.jobId) { show404('This job may have been removed or the link is invalid.'); return; }
      renderJob(job);
      injectSchema(job);
    })
    .catch(function (err) { showError(err.message || String(err)); });

  function renderJob(job) {
    var title = cleanTitle(job.title, job.jobId);
    var applyUrl = 'apply.html?job=' + encodeURIComponent(job.jobId);

    document.title = title + ' at ' + (job.company || 'Raveone') + ' | Raveone Careers';
    setMeta('description', truncate(job.description || title + ' at ' + job.company, 155));

    var pills = [];
    pills.push('<span class="meta-pill meta-id">' + esc(job.jobId) + '</span>');
    if (job.location) pills.push('<span class="meta-pill meta-loc">📍 ' + esc(job.location) + '</span>');
    var exp = formatExp(job);
    if (exp) pills.push('<span class="meta-pill meta-exp">' + exp + '</span>');
    if (job.salaryDisplay && job.salaryDisplay !== 'Not disclosed') pills.push('<span class="meta-pill meta-salary">💰 ' + esc(job.salaryDisplay) + '</span>');
    if (job.employmentType && job.employmentType !== 'Full Time') pills.push('<span class="meta-pill meta-type">' + esc(job.employmentType) + '</span>');
    if (job.positions > 1) pills.push('<span class="meta-pill meta-positions">' + job.positions + ' openings</span>');

    var website = cleanWebsiteUrl(job.website);
    var companyHtml = esc(job.company || '');
    if (website) companyHtml = '<a href="' + esc(website) + '" target="_blank" rel="noopener">' + esc(job.company) + '</a>';

    // Overview Grid
    var overviewHtml = '<div class="overview-grid">';
    if (job.location) overviewHtml += '<div class="overview-item"><div class="overview-icon">📍</div><div class="overview-label">Location</div><div class="overview-value">' + esc(job.location) + '</div></div>';
    if (exp) overviewHtml += '<div class="overview-item"><div class="overview-icon">💼</div><div class="overview-label">Experience</div><div class="overview-value">' + stripEmoji(exp) + '</div></div>';
    if (job.salaryDisplay && job.salaryDisplay !== 'Not disclosed') overviewHtml += '<div class="overview-item"><div class="overview-icon">💰</div><div class="overview-label">Salary</div><div class="overview-value">' + esc(job.salaryDisplay) + '</div></div>';
    if (job.employmentType) overviewHtml += '<div class="overview-item"><div class="overview-icon">🕒</div><div class="overview-label">Job Type</div><div class="overview-value">' + esc(job.employmentType) + '</div></div>';
    if (job.education) overviewHtml += '<div class="overview-item"><div class="overview-icon">🎓</div><div class="overview-label">Education</div><div class="overview-value">' + esc(job.education) + '</div></div>';
    if (job.industry) overviewHtml += '<div class="overview-item"><div class="overview-icon">🏢</div><div class="overview-label">Industry</div><div class="overview-value">' + esc(job.industry) + '</div></div>';
    overviewHtml += '</div>';

    var skillsHtml = '';
    var cleanSkills = (job.skills || []).filter(function (s) { return s && String(s).trim() && String(s).length < 60; });
    if (cleanSkills.length) {
      skillsHtml = '<h2 class="section-title">Skills Required</h2><div class="skills-list">' + cleanSkills.map(s => '<span class="skill-tag">' + esc(s) + '</span>').join('') + '</div>';
    }

    var benefitsHtml = '';
    var cleanBenefits = (job.benefits || []).filter(function (b) { return b && String(b).trim() && String(b).length < 80; });
    if (cleanBenefits.length) {
      benefitsHtml = '<h2 class="section-title">Benefits</h2><div class="skills-list">' + cleanBenefits.map(b => '<span class="benefit-tag">✓ ' + esc(b) + '</span>').join('') + '</div>';
    }

    var content = '<a href="' + SITE_URL + '/" class="back-link">← Back to all jobs</a>' +
      '<div class="detail-card">' +
        '<div class="detail-header">' +
          '<h1>' + esc(title) + '</h1>' +
          '<div class="detail-company">' + companyHtml + '</div>' +
          '<div class="detail-pills">' + pills.join('') + '</div>' +
        '</div>' +
        overviewHtml +
        (job.description ? '<h2 class="section-title" style="margin-top:32px">About the Role</h2><div class="section-body">' + esc(job.description) + '</div>' : '') +
        (job.requirements ? '<h2 class="section-title">Requirements</h2><div class="section-body">' + esc(job.requirements) + '</div>' : '') +
        skillsHtml + benefitsHtml +
      '</div>';

    var sidebarFacts = [{ label: 'Job ID', value: job.jobId }, { label: 'Posted', value: job.postedDate || '—' }, { label: 'Company', value: job.company || '—' }];
    if (job.positions > 1) sidebarFacts.push({ label: 'Openings', value: String(job.positions) });
    if (job.validThrough) sidebarFacts.push({ label: 'Valid Until', value: job.validThrough });

    var sidebar = '<div class="apply-card">' +
        '<h3>Interested in this role?</h3>' +
        '<p>Submit your application and our team will respond within 2–3 business days.</p>' +
        '<a href="' + esc(applyUrl) + '" class="btn-primary">Apply Now →</a>' +
        '<button class="btn-secondary" onclick="copyLink()">🔗 Copy Job Link</button>' +
      '</div>' +
      '<div class="apply-card">' +
        '<h3 style="font-size:14px;margin-bottom:16px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted)">Job Details</h3>' +
        sidebarFacts.map(f => '<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px"><span style="color:var(--text-muted);font-weight:500">' + esc(f.label) + '</span><span style="color:var(--text);font-weight:600;text-align:right">' + esc(f.value) + '</span></div>').join('') +
      '</div>';

    document.getElementById('jobMain').innerHTML = '<div>' + content + '</div><aside class="sidebar">' + sidebar + '</aside>';
  }

  function injectSchema(job) {
    var title = cleanTitle(job.title, job.jobId);
    var empType = 'FULL_TIME';
    var schema = {
      '@context': 'https://schema.org/', '@type': 'JobPosting', 'title': title,
      'description': sanitizeDescription(job.description || title), 'datePosted': toIsoDate(job.postedDate),
      'hiringOrganization': { '@type': 'Organization', 'name': job.company || 'Raveone Consultants' },
      'jobLocation': { '@type': 'Place', 'address': { '@type': 'PostalAddress', 'addressLocality': job.addressLocality || job.location || 'India', 'addressCountry': job.country || 'IN' } },
      'employmentType': empType,
      'identifier': { '@type': 'PropertyValue', 'name': 'Raveone Consultants', 'value': job.jobId }
    };
    if (job.addressRegion) schema.jobLocation.address.addressRegion = job.addressRegion;
    if (job.postalCode) schema.jobLocation.address.postalCode = job.postalCode;
    if (job.validThrough) { var valid = toIsoDate(job.validThrough); if (valid) schema.validThrough = valid + 'T23:59:59+05:30'; }
    if (job.industry) schema.industry = job.industry;
    if (job.education) schema.educationRequirements = { '@type': 'EducationalOccupationalCredential', 'credentialCategory': job.education };
    if (job.requirements) schema.responsibilities = job.requirements;
    
    if (job.skills && job.skills.length) {
      schema.skills = job.skills.filter(Boolean).join(', ');
    }

    var script = document.createElement('script');
    script.type = 'application/ld+json';
    script.text = JSON.stringify(schema);
    document.head.appendChild(script);
  }

  function toIsoDate(str) {
    if (!str) return '';
    var s = String(str).trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
    var m = s.match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
    if (m) {
      var months = { jan: '01', feb: '02', mar: '03', apr: '04', may: '05', jun: '06', jul: '07', aug: '08', sep: '09', oct: '10', nov: '11', dec: '12' };
      var mon = months[m[2].toLowerCase().slice(0, 3)];
      if (mon) return m[3] + '-' + mon + '-' + ('0' + m[1]).slice(-2);
    }
    var d = new Date(s);
    if (!isNaN(d.getTime())) return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    return '';
  }

  function cleanTitle(title, jobId) {
    if (!title) return 'Untitled Role';
    if (!jobId) return title;
    var escaped = jobId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return title.replace(new RegExp('^' + escaped + '\\s*[-–:\\s]\\s*', 'i'), '').trim() || title;
  }

  function cleanWebsiteUrl(raw) {
    if (!raw) return '';
    var w = String(raw).trim();
    if (!/^https?:\/\//i.test(w) && w.indexOf('.') !== -1) w = 'https://' + w;
    return /^https?:\/\//i.test(w) ? w : '';
  }

  function formatExp(job) {
    var min = String(job.minExp || '').trim(), max = String(job.maxExp || '').trim();
    if (/^fresh/i.test(min)) return '🌱 Fresher';
    var minN = parseFloat(min.replace(/[^\d.]/g, '')), maxN = parseFloat(max.replace(/[^\d.]/g, ''));
    if (!isNaN(minN) && minN > 0 && !isNaN(maxN) && maxN > 0) return '📊 ' + minN + '–' + maxN + ' Yrs';
    if (!isNaN(minN) && minN > 0) return '📊 ' + minN + '+ Yrs';
    if (!isNaN(maxN) && maxN > 0) return '📊 Up to ' + maxN + ' Yrs';
    return '';
  }

  function stripEmoji(s) { return String(s || '').replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu, '').trim(); }
  function sanitizeDescription(text) { return String(text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n\n+/g, '</p><p>').replace(/\n/g, '<br>').replace(/^/, '<p>').replace(/$/, '</p>'); }
  function truncate(s, n) { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  
  function setMeta(name, content, attr) {
    attr = attr || 'name';
    var existing = document.querySelector('meta[' + attr + '="' + name + '"]');
    if (existing) { existing.content = content; return; }
    var meta = document.createElement('meta');
    meta.setAttribute(attr, name); meta.content = content; document.head.appendChild(meta);
  }

  function show404(message) {
    document.title = 'Job Not Found | Raveone Careers';
    document.getElementById('jobMain').innerHTML = '<div style="grid-column:1/-1"><div class="msg-box"><div class="icon">🔍</div><h2>Job Not Found</h2><p>' + esc(message) + '</p><a href="' + SITE_URL + '/" class="btn-primary" style="max-width:220px;margin:0 auto">← Back to All Jobs</a></div></div>';
  }

  function showError(message) {
    document.title = 'Error | Raveone Careers';
    document.getElementById('jobMain').innerHTML = '<div style="grid-column:1/-1"><div class="msg-box"><div class="icon">⚠️</div><h2>Could Not Load Job</h2><p>' + esc(message) + '</p><button class="btn-primary" onclick="location.reload()" style="max-width:220px;margin:0 auto">Reload Page</button></div></div>';
  }

  window.copyLink = function () {
    var url = window.location.href;
    if (navigator.clipboard) { navigator.clipboard.writeText(url).then(() => alert('✓ Job link copied')).catch(() => window.prompt('Copy link:', url)); } 
    else { window.prompt('Copy link:', url); }
  };
})();
</script>
</body>
</html>
