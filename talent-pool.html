<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Your CV — Raveone Consultants</title>
  <meta name="description" content="Share your CV with Raveone Consultants. We'll reach out when a role matches your experience.">
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <style>
    .wrap { max-width: 560px; margin: 40px auto; padding: 0 20px 60px; }
    .card { padding: 28px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .full { grid-column: 1 / -1; }
    @media (max-width: 500px) { .grid { grid-template-columns: 1fr; } }
    .success { text-align: center; padding: 20px; }
    .success .check { width: 72px; height: 72px; border-radius: 50%; background: #D1FAE5; color: #15803D; font-size: 44px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  </style>
</head>
<body class="m3">
  <header class="m3-app-bar">
    <div class="m3-app-bar-brand">
      <div class="m3-brand-mark">R</div>
      <div><div class="m3-brand-name">Raveone Careers</div><div class="m3-brand-sub">Talent Pool</div></div>
    </div>
    <div class="m3-app-bar-spacer"></div>
    <a href="index.html" class="m3-btn m3-btn-text m3-btn-sm">← All jobs</a>
  </header>

  <div class="wrap">
    <div class="m3-card card">
      <h1 class="m3-h3" style="margin-bottom:8px">Submit your CV</h1>
      <p class="m3-text-muted" style="margin-bottom:20px">We'll keep your profile in our talent pool and reach out when a matching role opens.</p>
      <form id="tpForm" class="grid" onsubmit="submitTP(event)">
        <div class="m3-field full"><label class="m3-field-label">Full Name <span class="m3-field-required">*</span></label>
          <input type="text" class="m3-input" name="name" required maxlength="80"></div>
        <div class="m3-field"><label class="m3-field-label">Email <span class="m3-field-required">*</span></label>
          <input type="email" class="m3-input" name="email" required></div>
        <div class="m3-field"><label class="m3-field-label">Phone <span class="m3-field-required">*</span></label>
          <input type="tel" class="m3-input" name="phone" required pattern="[6-9][0-9]{9}" maxlength="10"></div>
        <div class="m3-field"><label class="m3-field-label">Total Experience</label>
          <input type="text" class="m3-input" name="totalExp" placeholder="e.g. 5 years"></div>
        <div class="m3-field"><label class="m3-field-label">Current Location</label>
          <input type="text" class="m3-input" name="location" placeholder="e.g. Bangalore"></div>
        <div class="m3-field full"><label class="m3-field-label">Skills</label>
          <input type="text" class="m3-input" name="skills" placeholder="e.g. CNC, VMC, GD&T"></div>
        <div class="m3-field full"><label class="m3-field-label">Resume (PDF / DOC / DOCX, max 7 MB)</label>
          <input type="file" class="m3-input" name="resume" accept=".pdf,.doc,.docx"></div>
        <div class="full" style="display:flex;justify-content:flex-end;margin-top:8px">
          <button type="submit" class="m3-btn m3-btn-filled" id="tpBtn">Add to Talent Pool</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
  async function submitTP(e) {
    e.preventDefault();
    const btn = document.getElementById('tpBtn');
    const fd = new FormData(e.target);
    btn.disabled = true; btn.textContent = 'Submitting…';
    try {
      let fileData = '', fileName = '';
      const f = fd.get('resume');
      if (f && f.size) {
        if (f.size > 7 * 1024 * 1024) throw new Error('Resume must be under 7 MB');
        const b64 = await ATS.fileToBase64(f);
        fileData = b64.base64; fileName = b64.name;
      }
      const res = await ATS.post('submitTalentPool', {
        name: fd.get('name').trim(), email: fd.get('email').trim(), phone: fd.get('phone').trim(),
        totalExp: fd.get('totalExp').trim(), location: fd.get('location').trim(),
        skills: fd.get('skills').trim(), fileData, fileName
      });
      if (!res.ok) throw new Error(res.error || 'Submission failed');
      document.querySelector('.card').innerHTML = `
        <div class="success">
          <div class="check"><span class="material-symbols-outlined" style="font-size:44px">check</span></div>
          <h2 class="m3-h3">You're in our talent pool</h2>
          <p class="m3-text-muted m3-mt-3">Reference: <b>${ATS.esc(res.applicationId || '')}</b><br>
          We'll reach out when a role matches your experience.</p>
          <a href="index.html" class="m3-btn m3-btn-filled m3-mt-4">Browse open roles</a>
        </div>`;
    } catch (err) {
      ATS.toast(err.message, 'error');
      btn.disabled = false; btn.textContent = 'Add to Talent Pool';
    }
  }
  </script>
</body>
</html>
