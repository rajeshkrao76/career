<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Your Profile | Raveone Careers</title>
<style>
  :root {
    --navy: #1A365D; --navy-2: #2A5487;
    --bg: #F8FAFC; --surface: #FFFFFF; --border: #E2E8F0;
    --text: #0F172A; --text-muted: #475569; --text-light: #94A3B8;
    --blue: #2563EB; --blue-bg: #DBEAFE;
    --success: #15803D; --success-bg: #D1FAE5;
    --danger: #B91C1C; --danger-bg: #FEE2E2;
    --warning: #B45309; --warning-bg: #FEF3C7;
    --radius: 12px;
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; font-size: 15px; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button, input, textarea, select { font-family: inherit; font-size: inherit; }

  .site-header { background: rgba(255,255,255,0.95); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px); }
  .site-header-inner { max-width: 800px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; color: var(--navy); }
  .brand-mark { width: 34px; height: 34px; background: linear-gradient(135deg, var(--navy), var(--navy-2)); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 15px; }
  .header-nav a { font-size: 14px; font-weight: 500; color: var(--text-muted); padding: 8px 14px; border-radius: 6px; }
  .header-nav a:hover { color: var(--text); background: var(--bg); }

  .form-wrap { max-width: 800px; margin: 0 auto; padding: 32px 24px 80px; }
  .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px; box-shadow: var(--shadow); }
  .form-card h1 { font-size: 28px; font-weight: 800; color: var(--navy); margin-bottom: 8px; letter-spacing: -0.02em; }
  .form-subtitle { font-size: 15px; color: var(--text-muted); margin-bottom: 32px; }

  .form-section { margin-bottom: 28px; }
  .form-section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--navy); padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
  .req { color: var(--danger); }
  .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 8px; outline: none; transition: all .15s; background: var(--bg); font-family: inherit; }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--blue); background: var(--surface); box-shadow: 0 0 0 3px var(--blue-bg); }
  .form-group textarea { resize: vertical; min-height: 80px; }

  .photo-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .photo-circle { width: 96px; height: 96px; border-radius: 50%; background: #F1F5F9; border: 3px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; color: var(--text-light); font-size: 36px; }
  .photo-circle img { width: 100%; height: 100%; object-fit: cover; }
  .btn-ghost { padding: 9px 16px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-muted); }
  .btn-ghost:hover { border-color: var(--navy); color: var(--navy); }

  .entry-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .entry-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .entry-label { font-size: 11px; font-weight: 800; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; }
  .btn-remove { background: var(--danger-bg); color: var(--danger); border: none; padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .btn-remove:hover { background: #FECACA; }
  .btn-add { margin-top: 12px; padding: 12px 16px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; border: 2px dashed #CBD5E1; background: var(--bg); color: var(--navy); width: 100%; }
  .btn-add:hover { border-color: var(--navy); background: var(--surface); }
  .empty-note { padding: 24px; text-align: center; color: var(--text-light); font-size: 13px; border: 1px dashed var(--border); border-radius: 8px; margin-bottom: 0; }

  .consent-box { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 14px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; font-size: 13px; color: var(--text-muted); }

  .form-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); }
  .btn-primary, .btn-secondary { padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; border: none; transition: all .15s; display: inline-flex; align-items: center; justify-content: center; }
  .btn-primary { background: var(--navy); color: white; }
  .btn-primary:hover:not(:disabled) { background: var(--navy-2); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
  .btn-secondary { background: var(--bg); color: var(--text-muted); }
  .btn-secondary:hover { background: var(--border); color: var(--text); }

  .alert { padding: 16px; border-radius: 8px; font-size: 14px; font-weight: 500; margin-bottom: 24px; }
  .alert-success { background: var(--success-bg); color: var(--success); border: 1px solid #BBF7D0; }
  .alert-error { background: var(--danger-bg); color: var(--danger); border: 1px solid #FECACA; }
  .alert-warning { background: var(--warning-bg); color: var(--warning); border: 1px solid #FDE68A; }

  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .state-screen { max-width: 560px; margin: 80px auto; text-align: center; padding: 48px 32px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .state-icon { font-size: 48px; margin-bottom: 16px; }
  .state-screen h2 { font-size: 22px; color: var(--navy); margin-bottom: 8px; }
  .state-screen p { color: var(--text-muted); margin-bottom: 20px; font-size: 14px; }

  .site-footer { background: var(--navy); color: var(--text-light); padding: 40px 24px 32px; margin-top: 80px; }
  .site-footer-inner { max-width: 800px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
  .site-footer .brand { color: white; }

  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-card { padding: 24px; }
    .form-actions { flex-direction: column; }
    .btn-primary, .btn-secondary { width: 100%; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <a href="./" class="brand"><div class="brand-mark">R</div><span>Raveone Careers</span></a>
    <nav class="header-nav"><a href="./">All Jobs</a></nav>
  </div>
</header>

<main class="form-wrap" id="root">
  <div class="state-screen">
    <div class="state-icon">⏳</div>
    <h2>Loading your profile…</h2>
    <p>Please wait while we fetch your details.</p>
  </div>
</main>

<footer class="site-footer">
  <div class="site-footer-inner">
    <div class="brand"><div class="brand-mark">R</div><span>Raveone Careers</span></div>
    <p>&copy; <span id="footerYear">2026</span> Raveone Consultants</p>
  </div>
</footer>

<script>
(function () {
  // ── CONFIG ─────────────────────────────────────────────────────────────
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby11ZYopJAAbHT0tsBu4v5YQe9TTpc_m88O43YhmEGYUg0kOlpudIDSWVF34ESc30k/exec";

  document.getElementById('footerYear').textContent = new Date().getFullYear();

  const params  = new URLSearchParams(window.location.search);
  const TOKEN   = (params.get('token') || '').trim();
  const root    = document.getElementById('root');

  if (!TOKEN) {
    showFatal('🔗', 'Link not valid', 'No update token was found in this URL. Please use the link from your email.');
    return;
  }

  // ── STATE ──────────────────────────────────────────────────────────────
  let PROFILE        = null;
  let APP_ID         = '';
  let EXPIRES_AT     = '';
  let EXP_ENTRIES    = [];
  let EDU_ENTRIES    = [];
  let PENDING_PHOTO  = null;   // { base64, fileName } | null | { base64: "", fileName: "" } (remove)
  let PHOTO_CHANGED  = false;

  // ── LOAD PROFILE ───────────────────────────────────────────────────────
  fetch(SCRIPT_URL + '?action=getCandidateByToken&token=' + encodeURIComponent(TOKEN))
    .then(r => r.json())
    .then(res => {
      if (!res || !res.ok) {
        showFatal('⏱️', 'Link not available', (res && res.error) || 'This link is invalid or has already been used.');
        return;
      }
      PROFILE    = res.profile || {};
      APP_ID     = res.appId || '';
      EXPIRES_AT = res.expiresAt || '';
      EXP_ENTRIES = Array.isArray(PROFILE.experience) ? PROFILE.experience.slice() : [];
      EDU_ENTRIES = Array.isArray(PROFILE.education)  ? PROFILE.education.slice()  : [];
      renderForm();
    })
    .catch(err => {
      showFatal('⚠️', 'Could not load profile', err.message || String(err));
    });

  // ── RENDER FORM ────────────────────────────────────────────────────────
  function renderForm() {
    const p = PROFILE;
    const v = x => esc(x || '');
    const sel = (a, b) => a === b ? 'selected' : '';
    const photoSrc = normalizePhotoUrl(p.photoUrl);

    const photoInner = photoSrc
      ? '<img id="photoPreview" src="' + v(photoSrc) + '" alt="Photo">'
      : '<span id="photoPlaceholder">👤</span>';

    root.innerHTML = `
      <div class="form-card">
        <h1>Update Your Profile</h1>
        <p class="form-subtitle">
          Hi <strong>${v(p.name)}</strong>, please review and update your details below.
          ${EXPIRES_AT ? `<br><span style="font-size:12px;color:var(--text-light)">Valid until ${v(formatExpiry(EXPIRES_AT))} · Application ${v(APP_ID)}</span>` : ''}
        </p>

        <form id="updateForm" novalidate>

          <div class="form-section">
            <div class="form-section-title">1 · Profile Photo</div>
            <div class="photo-row">
              <div class="photo-circle" id="photoCircle">${photoInner}</div>
              <div style="flex:1;min-width:220px">
                <div style="font-size:13px;color:var(--text-muted);margin-bottom:10px">
                  A clear headshot appears on the CV we share with clients.
                </div>
                <input type="file" id="photoInput" accept="image/*" style="display:none">
                <button type="button" class="btn-ghost" id="changePhotoBtn">📸 Change Photo</button>
                <button type="button" class="btn-ghost" id="removePhotoBtn" style="display:${photoSrc ? 'inline-block' : 'none'};margin-left:8px">✕ Remove</button>
                <div id="photoStatus" style="font-size:12px;color:var(--text-light);margin-top:8px"></div>
              </div>
            </div>
          </div>

          <div class="form-section">
            <div class="form-section-title">2 · Personal Information</div>
            <div class="form-grid">
              <div class="form-group">
                <label for="f_name">Full Name <span class="req">*</span></label>
                <input type="text" id="f_name" value="${v(p.name)}" required>
              </div>
              <div class="form-group">
                <label for="f_phone">Phone <span class="req">*</span></label>
                <input type="tel" id="f_phone" value="${v(p.phone)}" required>
              </div>
              <div class="form-group full">
                <label for="f_email">Email <span class="req">*</span></label>
                <input type="email" id="f_email" value="${v(p.email)}" required>
              </div>
              <div class="form-group full">
                <label for="f_location">Current Location <span class="req">*</span></label>
                <input type="text" id="f_location" value="${v(p.location)}" required>
              </div>
              <div class="form-group">
                <label for="f_dob">Date of Birth</label>
                <input type="date" id="f_dob" value="${v(p.dob)}">
              </div>
              <div class="form-group">
                <label for="f_gender">Gender</label>
                <select id="f_gender">
                  <option value="">— Select —</option>
                  <option ${sel(p.gender,'Male')}>Male</option>
                  <option ${sel(p.gender,'Female')}>Female</option>
                  <option ${sel(p.gender,'Other')}>Other</option>
                  <option ${sel(p.gender,'Prefer not to say')}>Prefer not to say</option>
                </select>
              </div>
              <div class="form-group full">
                <label for="f_nationality">Nationality</label>
                <input type="text" id="f_nationality" value="${v(p.nationality)}">
              </div>
            </div>
          </div>

          <div class="form-section">
            <div class="form-section-title">3 · Career</div>
            <div class="form-grid">
              <div class="form-group">
                <label for="f_company">Current Company</label>
                <input type="text" id="f_company" value="${v(p.company)}">
              </div>
              <div class="form-group">
                <label for="f_designation">Current Designation</label>
                <input type="text" id="f_designation" value="${v(p.designation)}">
              </div>
              <div class="form-group">
                <label for="f_totalExp">Total Experience</label>
                <input type="text" id="f_totalExp" value="${v(p.totalExp)}" placeholder="e.g. 5 years">
              </div>
              <div class="form-group">
                <label for="f_relExp">Relevant Experience</label>
                <input type="text" id="f_relExp" value="${v(p.relExp)}" placeholder="e.g. 3 years">
              </div>
              <div class="form-group">
                <label for="f_currentCtc">Current CTC</label>
                <input type="text" id="f_currentCtc" value="${v(p.currentCtc)}" placeholder="e.g. 6 LPA">
              </div>
              <div class="form-group">
                <label for="f_expectedCtc">Expected CTC</label>
                <input type="text" id="f_expectedCtc" value="${v(p.expectedCtc)}" placeholder="e.g. 9 LPA">
              </div>
              <div class="form-group">
                <label for="f_notice">Notice Period</label>
                <input type="text" id="f_notice" value="${v(p.notice)}" placeholder="e.g. 30 days">
              </div>
              <div class="form-group">
                <label for="f_education">Highest Education (text)</label>
                <input type="text" id="f_education" value="${v(p.educationText)}" placeholder="e.g. B.E. Mechanical">
              </div>
              <div class="form-group full">
                <label for="f_reason">Reason for Leaving</label>
                <textarea id="f_reason" rows="2">${v(p.reason)}</textarea>
              </div>
            </div>
          </div>

          <div class="form-section">
            <div class="form-section-title">4 · Skills &amp; Background</div>
            <div class="form-grid">
              <div class="form-group full">
                <label for="f_skills">Skills (comma-separated)</label>
                <textarea id="f_skills" rows="2">${v(p.skills)}</textarea>
              </div>
              <div class="form-group full">
                <label for="f_certs">Certifications</label>
                <textarea id="f_certs" rows="2">${v(p.certs)}</textarea>
              </div>
              <div class="form-group full">
                <label for="f_machines">Machines</label>
                <textarea id="f_machines" rows="2">${v(p.machines)}</textarea>
              </div>
              <div class="form-group full">
                <label for="f_languages">Languages Known</label>
                <input type="text" id="f_languages" value="${v(p.languages)}" placeholder="e.g. English, Hindi, Kannada">
              </div>
            </div>
          </div>

          <div class="form-section">
            <div class="form-section-title">5 · Preferences</div>
            <div class="form-grid">
              <div class="form-group">
                <label for="f_relocate">Willing to Relocate</label>
                <select id="f_relocate">
                  <option value="">— Select —</option>
                  <option ${sel(p.relocate,'Yes')}>Yes</option>
                  <option ${sel(p.relocate,'No')}>No</option>
                  <option ${sel(p.relocate,'Yes (travel only)')}>Yes (travel only)</option>
                  <option ${sel(p.relocate,'Prefers specific')}>Prefers specific</option>
                </select>
              </div>
              <div class="form-group">
                <label for="f_travel">Willing to Travel</label>
                <select id="f_travel">
                  <option value="">— Select —</option>
                  <option ${sel(p.travel,'Yes')}>Yes</option>
                  <option ${sel(p.travel,'No')}>No</option>
                  <option ${sel(p.travel,'Limited')}>Limited</option>
                </select>
              </div>
              <div class="form-group full">
                <label for="f_prefLocations">Preferred Locations</label>
                <input type="text" id="f_prefLocations" value="${v(p.prefLocations)}">
              </div>
              <div class="form-group">
                <label for="f_linkedin">LinkedIn URL</label>
                <input type="url" id="f_linkedin" value="${v(p.linkedin)}">
              </div>
              <div class="form-group">
                <label for="f_portfolio">Portfolio URL</label>
                <input type="url" id="f_portfolio" value="${v(p.portfolio)}">
              </div>
            </div>
          </div>

          <div class="form-section">
            <div class="form-section-title">6 · Work Experience</div>
            <div id="expCards"></div>
            <button type="button" class="btn-add" id="addExpBtn">+ Add Work Experience Entry</button>
          </div>

          <div class="form-section">
            <div class="form-section-title">7 · Education</div>
            <div id="eduCards"></div>
            <button type="button" class="btn-add" id="addEduBtn">+ Add Education Entry</button>
          </div>

          <div class="form-section">
            <div class="form-section-title">8 · Consent</div>
            <label class="consent-box">
              <input type="checkbox" id="f_consent" ${p.consent ? 'checked' : ''} style="margin-top:3px">
              <span>I consent to Raveone Consultants storing my profile and sharing it with prospective employers.</span>
            </label>
          </div>

          <div id="msg"></div>

          <div class="form-actions">
            <button type="submit" class="btn-primary" id="submitBtn">Save My Profile</button>
          </div>
        </form>
      </div>
    `;

    renderExpCards();
    renderEduCards();
    bindPhotoEvents();
    bindEntryEvents();
    document.getElementById('updateForm').addEventListener('submit', onSubmit);
  }

  // ── EXPERIENCE CARDS ───────────────────────────────────────────────────
  function renderExpCards() {
    const box = document.getElementById('expCards');
    if (!EXP_ENTRIES.length) {
      box.innerHTML = '<div class="empty-note">No experience entries yet. Click below to add your first one.</div>';
      return;
    }
    box.innerHTML = EXP_ENTRIES.map((e, i) => {
      const isPresent = String(e.endDate || '').toLowerCase() === 'present';
      const desc = Array.isArray(e.description) ? e.description.join('\n') : '';
      return `
        <div class="entry-card" data-exp-idx="${i}">
          <div class="entry-head">
            <span class="entry-label">Entry ${i + 1}</span>
            <button type="button" class="btn-remove" data-remove-exp="${i}">✕ Remove</button>
          </div>
          <div class="form-grid">
            <div class="form-group"><label>Job Title</label><input type="text" data-exp="title" value="${esc(e.title || '')}" placeholder="e.g. Sales Manager"></div>
            <div class="form-group"><label>Company</label><input type="text" data-exp="company" value="${esc(e.company || '')}" placeholder="e.g. ABC Corp"></div>
            <div class="form-group"><label>Start Date</label><input type="text" data-exp="startDate" value="${esc(e.startDate || '')}" placeholder="Jan 2020"></div>
            <div class="form-group"><label>End Date</label><input type="text" data-exp="endDate" value="${esc(isPresent ? '' : (e.endDate || ''))}" ${isPresent ? 'disabled' : ''} placeholder="Dec 2023"></div>
          </div>
          <div style="margin:10px 0">
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
              <input type="checkbox" data-exp="currentlyWorking" ${isPresent ? 'checked' : ''}>
              Currently working here
            </label>
          </div>
          <div class="form-group">
            <label>Responsibilities / Achievements (one per line)</label>
            <textarea data-exp="description" rows="3">${esc(desc)}</textarea>
          </div>
        </div>
      `;
    }).join('');
  }

  // ── EDUCATION CARDS ────────────────────────────────────────────────────
  function renderEduCards() {
    const box = document.getElementById('eduCards');
    if (!EDU_ENTRIES.length) {
      box.innerHTML = '<div class="empty-note">No education entries yet. Click below to add your first one.</div>';
      return;
    }
    box.innerHTML = EDU_ENTRIES.map((e, i) => `
      <div class="entry-card" data-edu-idx="${i}">
        <div class="entry-head">
          <span class="entry-label">Qualification ${i + 1}</span>
          <button type="button" class="btn-remove" data-remove-edu="${i}">✕ Remove</button>
        </div>
        <div class="form-grid">
          <div class="form-group"><label>Degree</label><input type="text" data-edu="degree" value="${esc(e.degree || '')}" placeholder="e.g. B.E., MBA, ITI"></div>
          <div class="form-group"><label>Field / Specialization</label><input type="text" data-edu="field" value="${esc(e.field || '')}" placeholder="e.g. Mechanical"></div>
          <div class="form-group"><label>Institution</label><input type="text" data-edu="institution" value="${esc(e.institution || '')}" placeholder="e.g. VTU Bangalore"></div>
          <div class="form-group"><label>Grade / Marks</label><input type="text" data-edu="grade" value="${esc(e.grade || '')}" placeholder="e.g. 8.5 CGPA"></div>
          <div class="form-group full"><label>Year of Completion</label><input type="text" data-edu="endDate" value="${esc(e.endDate || '')}" placeholder="e.g. 2017"></div>
        </div>
      </div>
    `).join('');
  }

  // ── BIND EXPERIENCE / EDUCATION EVENTS ─────────────────────────────────
  function bindEntryEvents() {
    document.getElementById('addExpBtn').addEventListener('click', () => {
      syncExp();
      EXP_ENTRIES.push({ company: '', title: '', startDate: '', endDate: '', description: [] });
      renderExpCards();
    });
    document.getElementById('addEduBtn').addEventListener('click', () => {
      syncEdu();
      EDU_ENTRIES.push({ degree: '', field: '', institution: '', grade: '', endDate: '' });
      renderEduCards();
    });

    document.getElementById('expCards').addEventListener('click', e => {
      const idx = e.target.getAttribute('data-remove-exp');
      if (idx === null) return;
      if (!confirm('Remove this work experience entry?')) return;
      syncExp();
      EXP_ENTRIES.splice(parseInt(idx, 10), 1);
      renderExpCards();
    });

    document.getElementById('eduCards').addEventListener('click', e => {
      const idx = e.target.getAttribute('data-remove-edu');
      if (idx === null) return;
      if (!confirm('Remove this education entry?')) return;
      syncEdu();
      EDU_ENTRIES.splice(parseInt(idx, 10), 1);
      renderEduCards();
    });

    document.getElementById('expCards').addEventListener('change', e => {
      const cb = e.target.getAttribute('data-exp');
      if (cb !== 'currentlyWorking') return;
      const card = e.target.closest('[data-exp-idx]');
      const endInput = card.querySelector('[data-exp="endDate"]');
      endInput.disabled = e.target.checked;
      if (e.target.checked) endInput.value = '';
    });
  }

  function syncExp() {
    const cards = document.querySelectorAll('#expCards [data-exp-idx]');
    const out = [];
    cards.forEach(card => {
      const entry = { company: '', title: '', startDate: '', endDate: '', description: [] };
      const isPresent = card.querySelector('[data-exp="currentlyWorking"]').checked;
      card.querySelectorAll('[data-exp]').forEach(el => {
        const name = el.getAttribute('data-exp');
        if (name === 'currentlyWorking') return;
        if (name === 'description') {
          entry.description = String(el.value || '').split('\n').map(s => s.trim()).filter(Boolean);
          return;
        }
        if (name === 'endDate' && isPresent) return;
        entry[name] = String(el.value || '').trim();
      });
      if (isPresent) entry.endDate = 'Present';
      if (entry.company || entry.title || entry.description.length) out.push(entry);
    });
    EXP_ENTRIES = out;
  }

  function syncEdu() {
    const cards = document.querySelectorAll('#eduCards [data-edu-idx]');
    const out = [];
    cards.forEach(card => {
      const entry = { degree: '', field: '', institution: '', grade: '', endDate: '' };
      card.querySelectorAll('[data-edu]').forEach(el => {
        entry[el.getAttribute('data-edu')] = String(el.value || '').trim();
      });
      if (entry.degree || entry.institution) out.push(entry);
    });
    EDU_ENTRIES = out;
  }

  // ── PHOTO ──────────────────────────────────────────────────────────────
  function bindPhotoEvents() {
    const fileInput = document.getElementById('photoInput');
    document.getElementById('changePhotoBtn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => {
      const file = e.target.files && e.target.files[0];
      if (file) handlePhoto(file);
    });
    document.getElementById('removePhotoBtn').addEventListener('click', () => {
      PENDING_PHOTO = { base64: '', fileName: '' };
      PHOTO_CHANGED = true;
      document.getElementById('photoCircle').innerHTML = '<span>👤</span>';
      document.getElementById('removePhotoBtn').style.display = 'none';
      const s = document.getElementById('photoStatus');
      s.style.color = 'var(--text-light)';
      s.textContent = 'Photo will be removed when you save.';
    });
  }

  function handlePhoto(file) {
    if (!/^image\//.test(file.type)) { alert('Please select an image file.'); return; }
    if (file.size > 10 * 1024 * 1024) { alert('Photo must be under 10 MB.'); return; }

    const status = document.getElementById('photoStatus');
    status.style.color = 'var(--text-muted)';
    status.textContent = 'Compressing…';

    compressImage(file, 800, 0.85)
      .then(result => {
        PENDING_PHOTO = { base64: result.base64, fileName: file.name };
        PHOTO_CHANGED = true;
        document.getElementById('photoCircle').innerHTML =
          '<img src="data:image/jpeg;base64,' + result.base64 + '" alt="Preview">';
        document.getElementById('removePhotoBtn').style.display = 'inline-block';
        status.style.color = 'var(--success)';
        status.textContent = '✓ Ready (' + Math.round(result.size / 1024) + ' KB after compression)';
      })
      .catch(err => {
        status.style.color = 'var(--danger)';
        status.textContent = '❌ ' + (err.message || 'Could not process image');
      });
  }

  function compressImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        try {
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            const r = Math.min(maxDim / w, maxDim / h);
            w = Math.round(w * r); h = Math.round(h * r);
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob(blob => {
            URL.revokeObjectURL(url);
            if (!blob) return reject(new Error('Compression failed'));
            const reader = new FileReader();
            reader.onload = ev => {
              const s = String(ev.target.result);
              resolve({ base64: s.substring(s.indexOf(',') + 1), size: blob.size });
            };
            reader.onerror = () => reject(new Error('Read failed'));
            reader.readAsDataURL(blob);
          }, 'image/jpeg', quality);
        } catch (err) { URL.revokeObjectURL(url); reject(err); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read image')); };
      img.src = url;
    });
  }

  // ── SUBMIT ─────────────────────────────────────────────────────────────
  function onSubmit(ev) {
    ev.preventDefault();
    const msg = document.getElementById('msg');
    msg.innerHTML = '';

    if (!val('f_name'))     { alert('Name is required'); return; }
    if (!val('f_phone'))    { alert('Phone is required'); return; }
    if (!val('f_email'))    { alert('Email is required'); return; }
    if (!val('f_location')) { alert('Location is required'); return; }

    syncExp(); syncEdu();

    const payload = {
      action:        'updateCandidateProfile',
      token:         TOKEN,
      name:          val('f_name'),
      phone:         val('f_phone'),
      email:         val('f_email').toLowerCase(),
      location:      val('f_location'),
      dob:           val('f_dob'),
      gender:        val('f_gender'),
      nationality:   val('f_nationality'),
      company:       val('f_company'),
      designation:   val('f_designation'),
      totalExp:      val('f_totalExp'),
      relExp:        val('f_relExp'),
      currentCtc:    val('f_currentCtc'),
      expectedCtc:   val('f_expectedCtc'),
      notice:        val('f_notice'),
      educationText: val('f_education'),   // ← string, goes to "Education"
      reason:        val('f_reason'),
      skills:        val('f_skills'),
      certs:         val('f_certs'),
      machines:      val('f_machines'),
      languages:     val('f_languages'),
      relocate:      val('f_relocate'),
      travel:        val('f_travel'),
      prefLocations: val('f_prefLocations'),
      linkedin:      val('f_linkedin'),
      portfolio:     val('f_portfolio'),
      consent:       document.getElementById('f_consent').checked,
      experience:    EXP_ENTRIES,          // ← JSON array
      education:     EDU_ENTRIES           // ← JSON array
    };

    if (PENDING_PHOTO && PENDING_PHOTO.base64) {
      payload.photoBase64   = PENDING_PHOTO.base64;
      payload.photoFileName = PENDING_PHOTO.fileName || 'photo.jpg';
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>&nbsp;' +
      (payload.photoBase64 ? 'Uploading photo & saving…' : 'Saving…');

    fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(result => {
      if (result.ok) {
        const written = (result.writtenFields || []).length;
        msg.innerHTML =
          '<div class="alert alert-success">' +
            '✅ Profile updated successfully · ' + written + ' field(s) saved' +
            ' · ' + (result.newCompleteness || 0) + '% complete' +
            (result.photoUploaded ? '<br>📸 Photo updated' : '') +
          '</div>' +
          (result.errors && result.errors.length
            ? '<div class="alert alert-warning">⚠️ Some fields were skipped:<br>' +
              result.errors.map(e => '• ' + esc(e)).join('<br>') + '</div>'
            : '');
        btn.style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        throw new Error(result.error || 'Update failed');
      }
    })
    .catch(err => {
      msg.innerHTML = '<div class="alert alert-error">⚠️ ' + esc(err.message) + '</div>';
      btn.disabled = false;
      btn.textContent = 'Save My Profile';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  // ── HELPERS ────────────────────────────────────────────────────────────
  function val(id) { return (document.getElementById(id).value || '').trim(); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function normalizePhotoUrl(url) {
    if (!url) return '';
    const m = String(url).match(/\/d\/([a-zA-Z0-9_-]+)/) || String(url).match(/[?&]id=([a-zA-Z0-9_-]+)/);
    return m ? 'https://lh3.googleusercontent.com/d/' + m[1] : url;
  }

  function formatExpiry(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function showFatal(icon, title, message) {
    root.innerHTML = `
      <div class="state-screen">
        <div class="state-icon">${icon}</div>
        <h2>${esc(title)}</h2>
        <p>${esc(message)}</p>
        <p style="font-size:12px;color:var(--text-light)">Please contact Raveone Consultants if you need a new link.</p>
      </div>`;
  }
})();
</script>
