<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Careers at Raveone Consultants | Executive & Specialist Jobs</title>
<meta name="description" content="Explore curated job opportunities from Raveone Consultants — MSME hiring partners in India.">
<style>
:root {
  --navy: #1A365D;
  --navy-2: #2A5487;
  --gold: #A16207;
  --gold-bg: #FEF3C7;
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --border: #E2E8F0;
  --text: #0F172A;
  --text-muted: #475569;
  --text-light: #94A3B8;
  --blue: #2563EB;
  --blue-bg: #DBEAFE;
  --success: #15803D;
  --success-bg: #D1FAE5;
  --warning: #B45309;
  --warning-bg: #FEF3C7;
  --danger: #B91C1C;
  --danger-bg: #FEE2E2;
  --radius: 12px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15,23,42,.04);
  --shadow: 0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
  --shadow-md: 0 4px 12px -2px rgba(15,23,42,.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button, input, select { font-family: inherit; font-size: inherit; }

/* ── Header ── */
.site-header {
  background: rgba(255,255,255,.95);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 17px;
  color: var(--navy);
  letter-spacing: -0.01em;
}
.brand-mark {
  width: 34px;
  height: 34px;
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 800;
  font-size: 15px;
}
.header-nav a {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-muted);
  padding: 8px 14px;
  border-radius: 6px;
  transition: all .15s;
}
.header-nav a:hover { color: var(--text); background: var(--bg); }

/* ── Hero ── */
.hero {
  background: linear-gradient(180deg, #FFFFFF 0%, var(--bg) 100%);
  padding: 56px 24px 40px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}
.hero-inner { max-width: 720px; margin: 0 auto; }
.hero h1 {
  font-size: 40px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--navy);
  margin-bottom: 12px;
  line-height: 1.15;
}
.hero p {
  font-size: 17px;
  color: var(--text-muted);
  margin-bottom: 28px;
}
.hero-search {
  display: flex;
  max-width: 560px;
  margin: 0 auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 6px;
  box-shadow: var(--shadow-md);
  transition: all .2s;
}
.hero-search:focus-within {
  border-color: var(--blue);
  box-shadow: 0 0 0 4px var(--blue-bg), var(--shadow-md);
}
.hero-search input {
  flex: 1;
  border: none;
  outline: none;
  padding: 12px 16px;
  font-size: 15px;
  background: transparent;
  color: var(--text);
}
.hero-search input::placeholder { color: var(--text-light); }
.hero-search button {
  background: var(--navy);
  color: white;
  border: none;
  padding: 0 28px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all .15s;
}
.hero-search button:hover { background: var(--navy-2); }

/* ── Main ── */
.main-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 24px 80px;
}
.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  gap: 16px;
  flex-wrap: wrap;
}
.toolbar-left {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.toolbar-right {
  font-size: 14px;
  color: var(--text-muted);
}
.toolbar-right strong { color: var(--text); font-weight: 700; }

.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 100px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s;
}
.filter-chip:hover { border-color: var(--navy); color: var(--navy); }
.filter-chip select {
  background: transparent;
  border: none;
  outline: none;
  color: inherit;
  font-weight: inherit;
  cursor: pointer;
}

/* ── Job Grid ── */
.job-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
@media (max-width: 768px) {
  .job-grid { grid-template-columns: 1fr; }
}

.job-card {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  transition: all .2s ease;
  position: relative;
  min-height: 200px;
}
.job-card:hover {
  border-color: var(--navy);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
.job-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 14px;
}
.job-card-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: -0.01em;
  margin-bottom: 4px;
  line-height: 1.3;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.job-card-company {
  font-size: 13.5px;
  color: var(--text-muted);
  font-weight: 500;
}
.job-card-arrow {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  flex-shrink: 0;
  transition: all .2s;
  font-size: 14px;
}
.job-card:hover .job-card-arrow {
  background: var(--navy);
  color: white;
  transform: translateX(2px);
}

.job-card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.meta-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 100px;
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
}
.meta-id       { background: var(--bg); color: var(--text-muted); font-family: ui-monospace, monospace; }
.meta-loc      { background: var(--blue-bg); color: var(--blue); }
.meta-exp      { background: var(--warning-bg); color: var(--warning); }
.meta-salary   { background: var(--success-bg); color: var(--success); }
.meta-type     { background: var(--bg); color: var(--text-muted); }
.meta-positions{ background: var(--gold-bg); color: var(--gold); }

.job-card-skills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.skill-tag {
  background: var(--bg);
  color: var(--text-muted);
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 11.5px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 160px;
}
.skill-tag-more {
  background: var(--navy);
  color: white;
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 11.5px;
  font-weight: 600;
}

.job-card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
  font-size: 11.5px;
  color: var(--text-light);
}
.job-card-footer .category-badge {
  background: var(--bg);
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 600;
}

/* ── Skeleton ── */
.skeleton {
  background: linear-gradient(90deg, #F1F5F9 0%, #E2E8F0 50%, #F1F5F9 100%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 6px;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.skeleton-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  min-height: 200px;
}
.skeleton-line { height: 14px; margin-bottom: 10px; }
.skeleton-line-lg { height: 20px; width: 70%; margin-bottom: 12px; }
.skeleton-line-md { width: 45%; }
.skeleton-pills { display: flex; gap: 8px; margin-top: 16px; }
.skeleton-pill { height: 22px; width: 80px; border-radius: 100px; }

/* ── Empty & Error ── */
.empty-state {
  text-align: center;
  padding: 80px 24px;
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  grid-column: 1 / -1;
}
.empty-icon {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  background: var(--blue-bg);
  color: var(--blue);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  font-size: 28px;
}
.empty-state h3 {
  font-size: 20px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 8px;
}
.empty-state p { color: var(--text-muted); font-size: 15px; }

.error-box {
  padding: 32px;
  background: var(--danger-bg);
  border: 1px solid #FCA5A5;
  border-radius: var(--radius);
  grid-column: 1 / -1;
}
.error-box h3 { color: var(--danger); font-size: 18px; margin-bottom: 12px; }
.error-box pre {
  font-family: ui-monospace, monospace;
  font-size: 12px;
  background: white;
  padding: 12px;
  border-radius: 6px;
  color: var(--danger);
  margin-bottom: 16px;
  white-space: pre-wrap;
  word-break: break-word;
}
.error-box button {
  padding: 10px 20px;
  background: var(--danger);
  color: white;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
}

/* ── Footer ── */
.site-footer {
  background: var(--navy);
  color: var(--text-light);
  padding: 40px 24px 32px;
  margin-top: 80px;
}
.footer-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}
.site-footer p { font-size: 14px; }
.site-footer .brand { color: white; }

@media (max-width: 640px) {
  .hero { padding: 40px 20px 32px; }
  .hero h1 { font-size: 30px; }
  .hero p { font-size: 15px; }
  .main-wrap { padding: 24px 16px 60px; }
  .job-card { padding: 18px; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="./" class="brand">
      <div class="brand-mark">R</div>
      <span>Raveone Careers</span>
    </a>
    <nav class="header-nav">
      <a href="https://career.raveone.in/about.html">About</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <h1>Find your next role</h1>
    <p>Curated opportunities from Raveone Consultants — MSME hiring partners</p>
    <div class="hero-search">
      <input type="text" id="searchInput"
             placeholder="Search by title, skill, company, or location..."
             onkeydown="if(event.key==='Enter')App.filter()">
      <button onclick="App.filter()">Search</button>
    </div>
  </div>
</section>

<main class="main-wrap">
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="filter-chip">
        <span>📍</span>
        <select id="locationFilter" onchange="App.filter()">
          <option value="">All Locations</option>
        </select>
      </div>
      <button class="filter-chip" onclick="App.clearFilters()">✕ Clear</button>
    </div>
    <div class="toolbar-right" id="jobCount">Loading…</div>
  </div>

  <div id="jobGrid" class="job-grid">
    <div class="skeleton-card">
      <div class="skeleton skeleton-line skeleton-line-lg"></div>
      <div class="skeleton skeleton-line skeleton-line-md"></div>
      <div class="skeleton-pills">
        <div class="skeleton skeleton-pill"></div>
        <div class="skeleton skeleton-pill"></div>
        <div class="skeleton skeleton-pill"></div>
      </div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton skeleton-line skeleton-line-lg"></div>
      <div class="skeleton skeleton-line skeleton-line-md"></div>
      <div class="skeleton-pills">
        <div class="skeleton skeleton-pill"></div>
        <div class="skeleton skeleton-pill"></div>
      </div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton skeleton-line skeleton-line-lg"></div>
      <div class="skeleton skeleton-line skeleton-line-md"></div>
      <div class="skeleton-pills">
        <div class="skeleton skeleton-pill"></div>
        <div class="skeleton skeleton-pill"></div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="brand">
      <div class="brand-mark">R</div>
      <span>Raveone Careers</span>
    </div>
    <p>&copy; <span id="footerYear">2026</span> Raveone Consultants · MSME Hiring Partners</p>
  </div>
</footer>

<script>
(function () {
  var SCRIPT_URL = "REPLACE_WITH_YOUR_DEPLOYMENT_URL";
  var ALL_JOBS = [];
  var IS_LOADING = false;

  var App = window.App = {
    init: function () {
      document.getElementById('footerYear').textContent = new Date().getFullYear();
      App.load();
    },

    load: function () {
      if (IS_LOADING) return;
      IS_LOADING = true;

      // Route 1: google.script.run (fast, server-rendered)
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function (jobs) {
            IS_LOADING = false;
            if (Array.isArray(jobs)) {
              App.setJobs(jobs);
            } else {
              App.fallbackFetch();
            }
          })
          .withFailureHandler(function () {
            IS_LOADING = false;
            App.fallbackFetch();
          })
          .getActiveJobsForCareerPage();
      } else {
        App.fallbackFetch();
      }
    },

    fallbackFetch: function () {
      fetch(SCRIPT_URL + '?action=jobs')
        .then(function (r) { return r.json(); })
        .then(function (jobs) {
          IS_LOADING = false;
          if (Array.isArray(jobs)) App.setJobs(jobs);
          else App.showError('Unexpected response from server');
        })
        .catch(function (err) {
          IS_LOADING = false;
          App.showError(err.message || String(err));
        });
    },

    setJobs: function (jobs) {
      ALL_JOBS = jobs.filter(function (j) { return j && j.jobId; });
      App.populateLocations();
      App.render(ALL_JOBS);
    },

    populateLocations: function () {
      var sel = document.getElementById('locationFilter');
      var seen = {};
      var cities = [];
      ALL_JOBS.forEach(function (j) {
        String(j.location || '').split(',').forEach(function (c) {
          var city = c.trim();
          if (city && !seen[city.toLowerCase()]) {
            seen[city.toLowerCase()] = true;
            cities.push(city);
          }
        });
      });
      cities.sort();
      sel.innerHTML = '<option value="">All Locations</option>' +
        cities.map(function (c) {
          return '<option value="' + App.esc(c) + '">' + App.esc(c) + '</option>';
        }).join('');
    },

    filter: function () {
      var q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      var loc = document.getElementById('locationFilter').value;

      var filtered = ALL_JOBS.filter(function (j) {
        if (q) {
          var hay = [
            j.title, j.company, j.jobId, j.location,
            j.category || '', j.industry || '',
            (j.skills || []).join(' '),
            j.description || ''
          ].join(' ').toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        if (loc) {
          var cities = String(j.location || '').split(',').map(function (c) {
            return c.trim().toLowerCase();
          });
          if (cities.indexOf(loc.toLowerCase()) === -1) return false;
        }
        return true;
      });

      App.render(filtered);
    },

    clearFilters: function () {
      document.getElementById('searchInput').value = '';
      document.getElementById('locationFilter').value = '';
      App.render(ALL_JOBS);
    },

    render: function (jobs) {
      var grid = document.getElementById('jobGrid');
      var count = document.getElementById('jobCount');

      count.innerHTML = '<strong>' + jobs.length + '</strong> ' +
        'job' + (jobs.length === 1 ? '' : 's') +
        (jobs.length < ALL_JOBS.length ? ' (filtered)' : '');

      if (!jobs.length) {
        grid.innerHTML =
          '<div class="empty-state">' +
            '<div class="empty-icon">🔍</div>' +
            '<h3>No matching jobs</h3>' +
            '<p>Try clearing your filters or searching for a different keyword.</p>' +
          '</div>';
        return;
      }

      grid.innerHTML = jobs.map(App.renderCard).join('');
    },

    renderCard: function (j) {
      var url = SCRIPT_URL + '?page=job&id=' + encodeURIComponent(j.jobId);
      var title = App.cleanTitle(j.title, j.jobId);

      // Meta pills
      var pills = [];
      pills.push('<span class="meta-pill meta-id">' + App.esc(j.jobId) + '</span>');
      if (j.location) {
        pills.push('<span class="meta-pill meta-loc">📍 ' + App.esc(j.location) + '</span>');
      }
      var exp = App.formatExp(j);
      if (exp) pills.push('<span class="meta-pill meta-exp">' + exp + '</span>');
      if (j.salaryDisplay && j.salaryDisplay !== 'Not disclosed') {
        pills.push('<span class="meta-pill meta-salary">💰 ' + App.esc(j.salaryDisplay) + '</span>');
      }
      if (j.employmentType && j.employmentType !== 'Full Time') {
        pills.push('<span class="meta-pill meta-type">' + App.esc(j.employmentType) + '</span>');
      }
      if (j.positions > 1) {
        pills.push('<span class="meta-pill meta-positions">' + j.positions + ' openings</span>');
      }

      // Skills chips (max 4, then +N more)
      var skills = (j.skills || []).filter(function (s) {
        return s && String(s).trim() && String(s).length < 50;
      });
      var skillsHtml = '';
      if (skills.length) {
        var visible = skills.slice(0, 4).map(function (s) {
          return '<span class="skill-tag">' + App.esc(s) + '</span>';
        }).join('');
        var more = skills.length > 4
          ? '<span class="skill-tag-more">+' + (skills.length - 4) + '</span>'
          : '';
        skillsHtml = '<div class="job-card-skills">' + visible + more + '</div>';
      }

      // Footer: posted date + category
      var footerLeft = j.postedDate
        ? 'Posted ' + App.esc(j.postedDate)
        : '';
      var footerRight = j.category
        ? '<span class="category-badge">' + App.esc(j.category) + '</span>'
        : '';

      return '<a href="' + App.esc(url) + '" class="job-card">' +
        '<div class="job-card-header">' +
          '<div>' +
            '<div class="job-card-title">' + App.esc(title) + '</div>' +
            '<div class="job-card-company">' + App.esc(j.company || '') + '</div>' +
          '</div>' +
          '<div class="job-card-arrow">→</div>' +
        '</div>' +
        '<div class="job-card-meta">' + pills.join('') + '</div>' +
        skillsHtml +
        (footerLeft || footerRight
          ? '<div class="job-card-footer">' +
              '<span>' + footerLeft + '</span>' +
              footerRight +
            '</div>'
          : '') +
      '</a>';
    },

    cleanTitle: function (title, jobId) {
      if (!title) return 'Untitled Role';
      if (!jobId) return title;
      var escaped = jobId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp('^' + escaped + '\\s*[-–:\\s]\\s*', 'i');
      var cleaned = title.replace(re, '').trim();
      return cleaned || title;
    },

    formatExp: function (j) {
      var min = String(j.minExp || '').trim();
      var max = String(j.maxExp || '').trim();
      if (/^fresh/i.test(min)) return '🌱 Fresher';
      var minN = parseFloat(min.replace(/[^\d.]/g, ''));
      var maxN = parseFloat(max.replace(/[^\d.]/g, ''));
      var hasMin = !isNaN(minN) && minN > 0;
      var hasMax = !isNaN(maxN) && maxN > 0;
      if (hasMin && hasMax) return '📊 ' + minN + '–' + maxN + ' Yrs';
      if (hasMin) return '📊 ' + minN + '+ Yrs';
      if (hasMax) return '📊 Up to ' + maxN + ' Yrs';
      return '';
    },

    esc: function (s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    },

    showError: function (msg) {
      var grid = document.getElementById('jobGrid');
      document.getElementById('jobCount').innerHTML = '<strong>0</strong> jobs';
      grid.innerHTML =
        '<div class="error-box">' +
          '<h3>⚠️ Could not load jobs</h3>' +
          '<pre>' + App.esc(msg || 'Unknown error') + '</pre>' +
          '<button onclick="location.reload()">Reload Page</button>' +
        '</div>';
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', App.init);
  } else {
    App.init();
  }
})();
</script>
</body>
</html>
