<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Login — Raveone Careers</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #F8FAFC 0%, #EFF6FF 100%); padding: 20px; }
    .login-card { background: #fff; border-radius: 20px; padding: 40px 32px; max-width: 440px; width: 100%; box-shadow: 0 20px 50px -12px rgba(15,23,42,.15); }
    .logo { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #1A365D, #2A5487); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 24px; margin: 0 auto 20px; }
    .title { text-align: center; margin-bottom: 6px; }
    .subtitle { text-align: center; color: #64748B; font-size: 13px; margin-bottom: 28px; }
    .step { display: none; }
    .step.active { display: block; }
    .otp-inputs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 20px 0; }
    .otp-inputs input { aspect-ratio: 1; text-align: center; font-size: 22px; font-weight: 700; padding: 0; border: 2px solid #E2E8F0; border-radius: 10px; outline: none; transition: all .15s; }
    .otp-inputs input:focus { border-color: #1A365D; box-shadow: 0 0 0 3px rgba(26,54,93,.12); }
    .otp-inputs input.filled { border-color: #1A365D; background: #F8FAFC; }
    .footer-link { text-align: center; margin-top: 20px; font-size: 12px; color: #94A3B8; }
    .footer-link a { color: #2A5487; font-weight: 600; text-decoration: none; }
    .resend { text-align: center; margin-top: 12px; font-size: 12px; color: #64748B; }
    .resend button { background: none; border: none; color: #2A5487; font-weight: 700; cursor: pointer; padding: 0; }
    .resend button:disabled { color: #94A3B8; cursor: not-allowed; }
  </style>
</head>
<body class="m3">
  <div class="login-card">
    <div class="logo">R</div>
    <h1 class="m3-h3 title" id="stepTitle">Candidate Portal</h1>
    <p class="subtitle" id="stepSubtitle">Sign in with your email to track applications</p>

    <div id="step1" class="step active">
      <div class="m3-field" style="margin-bottom:16px">
        <label class="m3-field-label">Email Address</label>
        <input type="email" class="m3-input" id="emailInput" placeholder="you@example.com" required>
      </div>
      <button class="m3-btn m3-btn-filled" style="width:100%" id="sendOtpBtn" onclick="sendOtp()">Send Login Code</button>
      <div class="footer-link">
        New here? <a href="index.html">Browse jobs</a> · <a href="client-login.html">Client login</a>
      </div>
    </div>

    <div id="step2" class="step">
      <div class="m3-field">
        <label class="m3-field-label">Enter 6-digit code</label>
        <div class="otp-inputs" id="otpInputs">
          <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
          <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
          <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
        </div>
      </div>
      <p class="resend">Code sent to <b id="sentTo"></b>. <button onclick="resendOtp()" id="resendBtn" disabled>Resend in <span id="countdown">30</span>s</button></p>
      <button class="m3-btn m3-btn-filled" style="width:100%;margin-top:12px" id="verifyBtn" onclick="verifyOtp()">Verify &amp; Sign In</button>
      <button class="m3-btn m3-btn-text" style="width:100%;margin-top:8px" onclick="backToEmail()">← Change email</button>
    </div>

    <div id="stepSuccess" class="step" style="text-align:center">
      <span class="material-symbols-outlined" style="font-size:56px;color:#16A34A">check_circle</span>
      <h2 class="m3-h4" style="margin-top:12px">Signed in!</h2>
      <p class="m3-text-muted" style="margin-top:8px">Redirecting to your portal…</p>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
  let CURRENT_EMAIL = '';
  let COUNTDOWN_TIMER = null;

  function el(id) { return document.getElementById(id); }
  function showStep(id) { ['step1','step2','stepSuccess'].forEach(s => el(s).classList.toggle('active', s === id)); }

  async function sendOtp() {
    const email = el('emailInput').value.trim().toLowerCase();
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      ATS.toast('Please enter a valid email', 'error'); return;
    }
    const btn = el('sendOtpBtn');
    btn.disabled = true; btn.textContent = 'Sending…';
    const res = await ATS.post('portalRequestOTP', { email });
    btn.disabled = false; btn.textContent = 'Send Login Code';
    if (!res.ok) { ATS.toast(res.error || 'Could not send code', 'error'); return; }
    CURRENT_EMAIL = email;
    el('sentTo').textContent = email;
    showStep('step2');
    el('otpInputs').querySelector('input').focus();
    startCountdown(30);
  }

  function startCountdown(secs) {
    const btn = el('resendBtn'); btn.disabled = true;
    let n = secs;
    el('countdown').textContent = n;
    clearInterval(COUNTDOWN_TIMER);
    COUNTDOWN_TIMER = setInterval(() => {
      n--;
      if (n <= 0) {
        clearInterval(COUNTDOWN_TIMER);
        btn.disabled = false;
        btn.innerHTML = 'Resend code';
      } else {
        el('countdown').textContent = n;
      }
    }, 1000);
  }

  async function resendOtp() {
    if (!CURRENT_EMAIL) return;
    el('resendBtn').disabled = true;
    const res = await ATS.post('portalRequestOTP', { email: CURRENT_EMAIL });
    if (res.ok) { ATS.toast('New code sent'); startCountdown(30); }
    else ATS.toast(res.error || 'Could not resend', 'error');
  }

  function backToEmail() { showStep('step1'); clearInterval(COUNTDOWN_TIMER); }

  // OTP input behaviour
  const otpInputs = el('otpInputs').querySelectorAll('input');
  otpInputs.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/\D/g, '').substring(0, 1);
      inp.classList.toggle('filled', !!inp.value);
      if (inp.value && i < otpInputs.length - 1) otpInputs[i + 1].focus();
      if (Array.from(otpInputs).every(x => x.value)) verifyOtp();
    });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !inp.value && i > 0) otpInputs[i - 1].focus();
    });
    inp.addEventListener('paste', e => {
      const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').substring(0, 6);
      if (text.length === 6) {
        otpInputs.forEach((x, j) => { x.value = text[j]; x.classList.add('filled'); });
        verifyOtp();
        e.preventDefault();
      }
    });
  });

  async function verifyOtp() {
    const otp = Array.from(otpInputs).map(x => x.value).join('');
    if (!/^\d{6}$/.test(otp)) return;
    const btn = el('verifyBtn');
    btn.disabled = true; btn.textContent = 'Verifying…';
    const res = await ATS.post('portalVerifyOTP', {
      email: CURRENT_EMAIL, otp, userAgent: navigator.userAgent.substring(0, 200)
    });
    btn.disabled = false; btn.textContent = 'Verify & Sign In';
    if (!res.ok) {
      ATS.toast(res.error || 'Incorrect code', 'error');
      otpInputs.forEach(x => { x.value = ''; x.classList.remove('filled'); });
      otpInputs[0].focus();
      return;
    }
    ATS.saveSession('candidate', {
      token: res.token, email: res.email, name: res.name, expiresAt: res.expiresAt
    });
    showStep('stepSuccess');
    setTimeout(() => window.location.replace('portal-app.html'), 900);
  }

  el('emailInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendOtp(); });

  // Already logged in?
  if (ATS.isLoggedIn('candidate')) window.location.replace('portal-app.html');
  </script>
</body>
</html>
